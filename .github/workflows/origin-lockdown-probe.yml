# Regression alarm for the Cloudflare-only origin lockdown.
#
# Runs from GitHub's runners (a non-Cloudflare source IP), so a direct hit to the
# origin IP MUST be dropped by the DOCKER-USER firewall (see deploy/origin-lockdown/).
# If the origin ever answers directly, the lockdown has regressed — every edge WAF /
# rate-limit / skip rule is bypassable again — and this job FAILS (+ optional Slack).
name: origin-lockdown-probe

on:
  schedule:
    - cron: "17 */6 * * *" # every 6 hours
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Direct-to-origin must be refused
        env:
          # Override in repo settings → Variables if the origin IP changes.
          ORIGIN_IP: ${{ vars.ORIGIN_IP }}
          HOSTN: api.shadow-warden-ai.com
        run: |
          set -u
          IP="${ORIGIN_IP:-91.98.234.160}"
          fail=0
          for port in 443 80; do
            [ "$port" = 443 ] && url="https://$HOSTN/health" || url="http://$HOSTN/health"
            # GH Actions runs this script as `bash -e`, so a bare `code=$(curl ...)`
            # whose curl fails (e.g. exit 28 on the expected timeout) kills the job
            # before the fallback ever runs. Testing the assignment in `if` exempts
            # it from errexit, so a blocked/timed-out probe becomes code=000 instead
            # of an uncaught script failure.
            if ! code=$(curl -sS -k --resolve "$HOSTN:$port:$IP" --max-time 15 \
                     -o /dev/null -w '%{http_code}' "$url" 2>/dev/null); then
              code=000
            fi
            echo "direct-to-origin :$port -> HTTP $code"
            if [ "$code" != "000" ]; then
              echo "::error::Origin reachable DIRECTLY on :$port (HTTP $code) — Cloudflare-only lockdown is BROKEN. See deploy/origin-lockdown/."
              fail=1
            fi
          done
          # ── OB-F22: operator surfaces, probed by raw IP ──────────────────
          #
          # The loop above only ever tested 443 and 80. That is the web path,
          # and it is not where the exposure was: landing/business-community
          # published a link to http://<origin-ip>:8501, the Streamlit
          # analytics dashboard, which reads the live /filter event stream.
          # docker-compose.smb.yml published that port on every interface.
          #
          # Measured 2026-09-04: both ports already time out from outside, so
          # the iptables lockdown is doing its job — but nothing verified that,
          # which means a regression would have been silent. These two lines
          # are what make the loopback bind in docker-compose.smb.yml checkable
          # rather than merely written down.
          #
          # No hostname here: these are not vhosts. Ask the origin IP directly,
          # which is exactly the question — is this port answering to anyone
          # who skips Cloudflare.
          for port in 8501 8502; do
            if ! code=$(curl -sS --max-time 15 -o /dev/null                      -w '%{http_code}' "http://$IP:$port/" 2>/dev/null); then
              code=000
            fi
            echo "direct-to-origin :$port -> HTTP $code"
            if [ "$code" != "000" ]; then
              echo "::error::Operator dashboard reachable DIRECTLY on :$port (HTTP $code). Streamlit shows live security telemetry and its auth defaults to open without DASHBOARD_PASSWORD_HASH — see warden/tests/test_smb_perimeter.py."
              fail=1
            fi
          done

          # Context only (not a failure condition here): the Cloudflare path should stay up.
          if ! cf=$(curl -sS --max-time 15 -o /dev/null -w '%{http_code}' "https://$HOSTN/health" 2>/dev/null); then
            cf=000
          fi
          echo "via Cloudflare -> HTTP $cf"
          exit $fail

      - name: Alert Slack on regression
        if: failure()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          [ -z "$SLACK_WEBHOOK_URL" ] && { echo "no webhook configured; skipping Slack alert"; exit 0; }
          curl -s -X POST "$SLACK_WEBHOOK_URL" -H 'Content-Type: application/json' \
            --data '{"text":":rotating_light: *Origin lockdown regression* — api.shadow-warden-ai.com is reachable directly at the origin IP, bypassing Cloudflare WAF/rate-limit. Re-run `deploy/origin-lockdown/install.sh` on the VPS. https://github.com/zborrman/Shadow-Warden-AI/blob/main/deploy/origin-lockdown/README.md"}'
