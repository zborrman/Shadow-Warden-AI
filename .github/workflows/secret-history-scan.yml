# Full-history secret scan.
#
# The gitleaks step in ci.yml runs on pull_request, where the action scans only
# the commits under review:
#
#   gitleaks detect --log-opts=--no-merges --first-parent <base>^..<head>
#
# That is the right scope for a PR gate — it fails the author who introduced the
# secret — but it means nothing re-reads the past. A secret merged before the
# gate existed, or one that slipped through while a rule was missing, is never
# looked at again. The .gitleaks.toml allowlist already records one case where a
# latent false positive sat unnoticed for months because only new commits were
# ever scanned (PR #268).
#
# First full-history run was 2026-08-28: 22 findings, all env-var names,
# documentation placeholders or test fixtures -- no live credential. Triaging
# them was not enough: nothing recorded the verdict, so the job failed on the
# same 22 every week. A guard that is permanently red reports nothing, because
# a 23rd finding looks exactly like the other 22.
#
# The verdict now lives in .gitleaksignore, one commit-pinned fingerprint per
# match. A new secret arrives in a new commit, so it gets a fingerprint nothing
# here covers, and the job goes red for a reason worth reading.
# warden/tests/test_secret_scan_baseline.py stops that file from growing into a
# blanket suppression.
#
# NOTE ON SCOPE: this scans *reachable* history. Commits orphaned by a
# force-push stay fetchable on GitHub by SHA and are not covered here — see
# docs/ for why rewriting history is not redaction. Rotation is the remedy for
# anything already pushed.
name: Secret History Scan

on:
  schedule:
    - cron: "17 4 * * 1"        # Mondays 04:17 UTC, off the hour to avoid the rush
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: secret-history-scan
  cancel-in-progress: false

jobs:
  scan:
    name: gitleaks (full history)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 0        # every commit, not just the PR range

      # Does not fail the job here. A bare non-zero exit says only "some number
      # of matches", and reading them meant downloading the SARIF artifact --
      # so the failure carried no information at the place people look at it.
      - name: Scan all reachable history
        id: scan
        run: |
          set +e
          docker run --rm -v "$PWD:/repo" -w /repo \
            ghcr.io/gitleaks/gitleaks:latest \
            detect --source /repo --redact --no-banner \
                   --config /repo/.gitleaks.toml \
                   --report-format sarif --report-path /repo/gitleaks-history.sarif
          echo "status=$?" >> "$GITHUB_OUTPUT"

      - name: Summarise findings
        if: always()
        run: |
          python3 - <<'PY' | tee -a "$GITHUB_STEP_SUMMARY"
          import json, pathlib
          report = pathlib.Path("gitleaks-history.sarif")
          if not report.exists():
              print("## Secret history scan\n\nNo report produced - the scan step "
                    "itself failed. Check the log above.")
              raise SystemExit(0)
          results = json.loads(report.read_text(encoding="utf-8"))["runs"][0]["results"]
          if not results:
              print("## Secret history scan\n\nNo findings outside the "
                    "`.gitleaksignore` baseline.")
              raise SystemExit(0)
          print(f"## Secret history scan - {len(results)} finding(s) not in the baseline\n")
          print("| rule | file | line | commit |")
          print("| --- | --- | --- | --- |")
          for r in results:
              loc = r["locations"][0]["physicalLocation"]
              sha = r.get("partialFingerprints", {}).get("commitSha", "")
              print(f"| `{r.get('ruleId')}` | `{loc['artifactLocation']['uri']}` "
                    f"| {loc.get('region', {}).get('startLine', '?')} | `{sha[:12]}` |")
          print("\nValues are redacted. Open the commit to read the match, then "
                "either rotate the credential or add its fingerprint to "
                "`.gitleaksignore` with a note saying why it is not one.")
          PY

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-history-sarif
          path: gitleaks-history.sarif
          if-no-files-found: warn

      - name: Fail on findings
        if: steps.scan.outputs.status != '0'
        run: |
          echo "gitleaks exited ${{ steps.scan.outputs.status }} - see the summary above"
          exit 1
