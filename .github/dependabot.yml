version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/warden"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "security"
    ignore:
      # Playwright is pinned — browser sandbox is disabled (BROWSER_ENABLED=false).
      # Upgrading requires re-enabling MCR base image + playwright install chromium.
      - dependency-name: "playwright"
      # scipy >= 1.18 requires Python >= 3.12, and this project's floor is 3.11:
      # pyproject `requires-python = ">=3.11"`, warden/Dockerfile `python:3.11-slim`,
      # and the CI matrix tests 3.11. PR #468 (scipy 1.18.1) could not install on
      # 3.11 at all — ResolutionImpossible, which failed the 3.11 tests, pip-audit
      # and the Docker build. Lift this together with the move to Python 3.12, not
      # before. Patch releases on 1.17.x are still offered.
      - dependency-name: "scipy"
        versions: [">=1.18"]
      # redis >= 6 cannot install: arq 0.28.0 (the ARQ worker behind every
      # scheduled job) declares `redis<6`. PR #471 (redis 5.3.1 -> 8.1.0) hit
      # ResolutionImpossible on 3.11 and 3.12, pip-audit and the Docker build.
      # Lift when arq releases support for redis 6+.
      - dependency-name: "redis"
        versions: [">=6"]
      # magika >= 0.7 cannot install: markitdown 0.1.6 (Document Intelligence)
      # declares `magika~=0.6.1`. PR #472 (magika 0.6.3 -> 1.0.3) hit the same
      # ResolutionImpossible. Lift when markitdown widens its pin.
      - dependency-name: "magika"
        versions: [">=0.7"]
      # eth-keyfile >= 0.9 and eth-account >= 0.14 belong to the web3 8.x line:
      # web3 8.0.0 requires eth-account>=0.14 and hexbytes>=2, while this stack
      # is web3 7.16.0 with hexbytes 1.3.1 and eth-rlp 2.2.0. PR #483 bumped
      # eth-keyfile alone (eth-account 0.13.7 declares eth-keyfile<0.9) and PR
      # #493 tried the pair, which then demanded eth-rlp>=3, hexbytes>=2 and
      # eth-utils>=6 — the cascade is a web3 7 -> 8 migration touching the
      # settlement path, not a dependency bump. Lift both with that migration.
      - dependency-name: "eth-keyfile"
        versions: [">=0.9"]
      - dependency-name: "eth-account"
        versions: [">=0.14"]

  - package-ecosystem: "docker"
    directory: "/warden"
    schedule:
      interval: "monthly"
    labels:
      - "dependencies"
      - "docker"

  - package-ecosystem: "docker"
    directory: "/analytics"
    schedule:
      interval: "monthly"
    labels:
      - "dependencies"
      - "docker"

  - package-ecosystem: "docker"
    directory: "/app"
    schedule:
      interval: "monthly"
    labels:
      - "dependencies"
      - "docker"

  - package-ecosystem: "docker"
    directory: "/portal"
    schedule:
      interval: "monthly"
    labels:
      - "dependencies"
      - "docker"

  - package-ecosystem: "docker"
    directory: "/admin"
    schedule:
      interval: "monthly"
    labels:
      - "dependencies"
      - "docker"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    labels:
      - "dependencies"
      - "ci"
