version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/warden"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "security"
    # Families pinned with `==` in warden/constraints.txt must be bumped as a
    # set, or the bump cannot resolve. OpenTelemetry is the demonstrated case:
    # every member cross-pins its siblings exactly
    # (`opentelemetry-exporter-otlp-proto-http 1.45.0` requires
    # `opentelemetry-exporter-otlp-proto-common==1.45.0`), so a single-package
    # PR is unmergeable by construction — PR #561 failed both test legs, the
    # Docker build and pip-audit with ResolutionImpossible, and every later
    # release would have produced the same PR again. Grouping, not `ignore`:
    # these updates are wanted, just not one at a time.
    groups:
      opentelemetry:
        patterns:
          - "opentelemetry-*"
      # Same shape, second instance: boto3 pins botocore to an exact floor
      # (`boto3 1.43.108 depends on botocore<1.44.0 and >=1.43.108`) and also
      # caps s3transfer, so a single-package bump is unmergeable. PR #573 failed
      # both test legs, the Docker build and pip-audit with ResolutionImpossible
      # against the pinned botocore==1.43.102. Named explicitly rather than by a
      # `boto*` glob, which would miss s3transfer.
      aws-sdk:
        patterns:
          - "boto3"
          - "botocore"
          - "s3transfer"
      # Everything else, minor and patch, as one weekly PR. constraints.txt is a
      # `pip freeze` that Dependabot edits one line at a time, so any pair of
      # packages with a cross-pin breaks a single-package bump (the two family
      # groups above are the instances found so far); and one PR per package
      # cost a review per package — 11 between 2026-10-13 and 10-15, two of which
      # (#567 pyee, #587 huggingface-hub) could not install at all.
      # Groups match in order, so the families above keep their own PRs.
      # Majors stay one PR each: they are the bumps worth reading on their own.
      # Security updates are not grouped (this applies to version updates only),
      # so a CVE fix never waits for the weekly batch.
      # If the grouped PR fails to resolve, find the package in its log and add
      # an `ignore` below tied to the pin that caps it - the same rule as pyee.
      pip-minor-and-patch:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    ignore:
      # Playwright is pinned — browser sandbox is disabled (BROWSER_ENABLED=false).
      # Upgrading requires re-enabling MCR base image + playwright install chromium.
      - dependency-name: "playwright"
      # pyee is capped by that same playwright pin, not by anything about pyee:
      # `playwright 1.61.0 depends on pyee<14 and >=13`. PR #567 (pyee 13.0.1 ->
      # 14.0.0) failed both test legs, the Docker build and pip-audit with
      # ResolutionImpossible. The cap lifts only when the playwright pin above
      # lifts - it is not an independent decision, so it is documented here
      # rather than left to be rediscovered from a red PR each release.
      #
      # General rule for this file: a transitive whose range is constrained by a
      # *pinned* parent needs an ignore tied to that parent. `greenlet` is the
      # other playwright-capped transitive in warden/constraints.txt; expect the
      # same failure shape if a major bump for it is ever offered.
      - dependency-name: "pyee"
        versions: [">=14"]
      # huggingface-hub is capped by transformers, same shape as pyee above:
      # `transformers 5.13.0 depends on huggingface-hub<2.0 and >=1.5.0`. PR #587
      # (1.32.0 -> 2.2.0) failed both test legs, the Docker build and pip-audit
      # with ResolutionImpossible. 1.x releases are still offered. Lift this
      # when a transformers release accepts huggingface-hub 2 - bump them together.
      - dependency-name: "huggingface-hub"
        versions: [">=2"]
      # scipy >= 1.18 requires Python >= 3.12, and this project's floor is 3.11:
      # pyproject `requires-python = ">=3.11"`, warden/Dockerfile `python:3.11-slim`,
      # and the CI matrix tests 3.11. PR #468 (scipy 1.18.1) could not install on
      # 3.11 at all — ResolutionImpossible, which failed the 3.11 tests, pip-audit
      # and the Docker build. Lift this together with the move to Python 3.12, not
      # before. Patch releases on 1.17.x are still offered.
      - dependency-name: "scipy"
        versions: [">=1.18"]
      # sphinx >= 9.1 requires Python >= 3.12 — the same wall as scipy above.
      # PR #521 (sphinx 9.0.4 -> 9.1.0) failed only on the 3.11 leg of the
      # matrix: ResolutionImpossible ("no matching distributions available"),
      # which took down the 3.11 tests, pip-audit and the Docker build while
      # 3.12 passed. Lift this with the move to Python 3.12, not before. Patch
      # releases on 9.0.x are still offered.
      - dependency-name: "sphinx"
        versions: [">=9.1"]
      # redis >= 6 cannot install: arq 0.28.0 (the ARQ worker behind every
      # scheduled job) declares `redis<6`. PR #471 (redis 5.3.1 -> 8.1.0) hit
      # ResolutionImpossible on 3.11 and 3.12, pip-audit and the Docker build.
      # Lift when arq releases support for redis 6+.
      - dependency-name: "redis"
        versions: [">=6"]
      # magika >= 0.7 cannot install: markitdown 0.1.6 (Document Intelligence)
      # declares `magika~=0.6.1`. PR #472 (magika 0.6.3 -> 1.0.3) hit the same
      # ResolutionImpossible. Lift when markitdown widens its pin.
      - dependency-name: "magika"
        versions: [">=0.7"]
      # eth-keyfile >= 0.9 and eth-account >= 0.14 belong to the web3 8.x line:
      # web3 8.0.0 requires eth-account>=0.14 and hexbytes>=2, while this stack
      # is web3 7.16.0 with hexbytes 1.3.1 and eth-rlp 2.2.0. PR #483 bumped
      # eth-keyfile alone (eth-account 0.13.7 declares eth-keyfile<0.9) and PR
      # #493 tried the pair, which then demanded eth-rlp>=3, hexbytes>=2 and
      # eth-utils>=6 — the cascade is a web3 7 -> 8 migration touching the
      # settlement path, not a dependency bump. Lift both with that migration.
      - dependency-name: "eth-keyfile"
        versions: [">=0.9"]
      - dependency-name: "eth-account"
        versions: [">=0.14"]
      # web3 8 itself (#620): requires eth-account>=0.14, the migration above.
      - dependency-name: "web3"
        versions: [">=8"]
      # pycryptodome 4 (#630): eth-keyfile 0.10 declares pycryptodome<4. Same
      # web3-line cap - lift with the web3 7 -> 8 migration.
      - dependency-name: "pycryptodome"
        versions: [">=4"]
      # av 19 requires Python >=3.12 (#622; faster-whisper accepts any av>=11).
      - dependency-name: "av"
        versions: [">=19"]
      # Found by the first grouped PR (#601, 76 updates), which cannot resolve
      # while any one of these is in it. Each was isolated by re-resolving the
      # batch on Python 3.11 and holding back one package at a time.
      # Python 3.11 wall (lift with the move to 3.12, like scipy/sphinx above):
      - dependency-name: "numpy"
        versions: [">=2.5"]
      - dependency-name: "deprecated"      # 3.x not installable on 3.11 (#604)
        versions: [">=3"]
      - dependency-name: "docutils"        # sphinx 9.0.x requires docutils<0.23
        versions: [">=0.23"]
      - dependency-name: "networkx"        # 3.7 requires Python >=3.12 (#608)
        versions: [">=3.7"]
      # Capped by a pinned parent - lift together with that parent:
      - dependency-name: "sphinx-press-theme"   # libsql-client 0.3.1: <0.9
        versions: [">=0.9"]
      - dependency-name: "parsimonious"    # eth-abi 5.2 (web3 7 line): <0.11
        versions: [">=0.11"]
      - dependency-name: "mpmath"          # sympy 1.14: <1.4
        versions: [">=1.4"]
      - dependency-name: "pyarrow"         # streamlit 1.65: <26 (#609)
        versions: [">=26"]

  - package-ecosystem: "docker"
    directory: "/warden"
    schedule:
      interval: "monthly"
    labels:
      - "dependencies"
      - "docker"
    # The Python version of a base image is a migration, not a bump: the
    # floor is 3.11 (pyproject, CI matrix) and several ignores above are
    # 3.11 walls that lift together with it. #18-#21 proposed 3.11/3.12 ->
    # 3.14 and sat unmergeable from 2026-04-01. Patch and digest updates of
    # the current line are still offered.
    ignore:
      - dependency-name: "python"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]

  - package-ecosystem: "docker"
    directory: "/analytics"
    schedule:
      interval: "monthly"
    labels:
      - "dependencies"
      - "docker"
    # The Python version of a base image is a migration, not a bump: the
    # floor is 3.11 (pyproject, CI matrix) and several ignores above are
    # 3.11 walls that lift together with it. #18-#21 proposed 3.11/3.12 ->
    # 3.14 and sat unmergeable from 2026-04-01. Patch and digest updates of
    # the current line are still offered.
    ignore:
      - dependency-name: "python"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]

  - package-ecosystem: "docker"
    directory: "/app"
    schedule:
      interval: "monthly"
    labels:
      - "dependencies"
      - "docker"
    # The Python version of a base image is a migration, not a bump: the
    # floor is 3.11 (pyproject, CI matrix) and several ignores above are
    # 3.11 walls that lift together with it. #18-#21 proposed 3.11/3.12 ->
    # 3.14 and sat unmergeable from 2026-04-01. Patch and digest updates of
    # the current line are still offered.
    ignore:
      - dependency-name: "python"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]

  - package-ecosystem: "docker"
    directory: "/portal"
    schedule:
      interval: "monthly"
    labels:
      - "dependencies"
      - "docker"

  - package-ecosystem: "docker"
    directory: "/admin"
    schedule:
      interval: "monthly"
    labels:
      - "dependencies"
      - "docker"
    # The Python version of a base image is a migration, not a bump: the
    # floor is 3.11 (pyproject, CI matrix) and several ignores above are
    # 3.11 walls that lift together with it. #18-#21 proposed 3.11/3.12 ->
    # 3.14 and sat unmergeable from 2026-04-01. Patch and digest updates of
    # the current line are still offered.
    ignore:
      - dependency-name: "python"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    labels:
      - "dependencies"
      - "ci"
