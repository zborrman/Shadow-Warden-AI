name = "shadow-warden-installer"
main = "src/index.js"
compatibility_date = "2025-01-01"
workers_dev = false
preview_urls = false

# Route: get.shadow-warden-ai.com/install
#
# It used to name a host in a look-alike zone this project does not own, and
# that whole zone is NXDOMAIN — see warden/tests/test_no_dead_contact_domain.py.
# Cloudflare Workers Builds has redeployed this Worker on every push to main
# (10 deployments in two days, 1:1 with pushes) while it answered on nothing.
#
# The zone is now the right one, so a single DNS record makes it real. That
# record does not exist yet: until somebody adds `get` to the
# shadow-warden-ai.com zone and binds it as a Custom Domain, this Worker is
# still deployed and still unreachable.

[[kv_namespaces]]
binding = "INSTALL_STATS"
id = "9a67a5312aed471da1922161af78fe25"
preview_id = "650f939d92d54b26974f7cc019dc5bc0"

[vars]
SCRIPT_VERSION = "2.9"
GITHUB_RAW_URL = "https://raw.githubusercontent.com/zborrman/Shadow-Warden-AI/main/scripts/install.sh"
ALLOWED_PATHS   = "/install,/install.sh"
