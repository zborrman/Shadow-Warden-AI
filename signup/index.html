<!DOCTYPE html><html lang="en" class="dark" data-astro-cid-vhn3vrze> <head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><meta name="robots" content="noindex"><title>Create Account — Shadow Warden AI</title><link rel="icon" href="/logo.png" type="image/png"><link rel="icon" href="/favicon.svg" type="image/svg+xml"><link rel="agent-protocol" href="/.well-known/agent.json" type="application/json"><link rel="stylesheet" href="/_astro/signup.Ir1kLByz.css"></head> <body data-astro-cid-vhn3vrze> <div class="card" data-astro-cid-vhn3vrze> <div class="logo-wrap" data-astro-cid-vhn3vrze> <img src="/logo.png" alt="Shadow Warden AI" data-astro-cid-vhn3vrze> <span class="logo-text" data-astro-cid-vhn3vrze>Shadow-<span data-astro-cid-vhn3vrze>Warden</span>-AI</span> </div> <h1 data-astro-cid-vhn3vrze>Create your account</h1> <p class="subtitle" data-astro-cid-vhn3vrze>Zero-Trust AI Security Gateway</p> <form id="signup-form" novalidate data-astro-cid-vhn3vrze> <label for="email" data-astro-cid-vhn3vrze>Email address</label> <input id="email" type="email" name="email" placeholder="you@company.com" autocomplete="email" required data-astro-cid-vhn3vrze> <label for="password" data-astro-cid-vhn3vrze>Password</label> <input id="password" type="password" name="password" placeholder="Min. 8 characters" autocomplete="new-password" required data-astro-cid-vhn3vrze> <!-- Strength indicator --> <div class="pw-strength" id="pw-strength" style="display:none" data-astro-cid-vhn3vrze> <div class="pw-bar" id="pw-bar-1" data-astro-cid-vhn3vrze></div> <div class="pw-bar" id="pw-bar-2" data-astro-cid-vhn3vrze></div> <div class="pw-bar" id="pw-bar-3" data-astro-cid-vhn3vrze></div> <div class="pw-bar" id="pw-bar-4" data-astro-cid-vhn3vrze></div> <span class="pw-label" id="pw-label" data-astro-cid-vhn3vrze></span> </div> <label for="confirm" data-astro-cid-vhn3vrze>Confirm password</label> <input id="confirm" type="password" name="confirm" placeholder="Repeat your password" autocomplete="new-password" required data-astro-cid-vhn3vrze> <div class="field-hint" id="confirm-hint" data-astro-cid-vhn3vrze>Passwords do not match.</div> <button id="submit-btn" class="btn-primary" type="submit" data-astro-cid-vhn3vrze>Create Account</button> <div id="error-msg" data-astro-cid-vhn3vrze></div> </form> <p class="footer-link" data-astro-cid-vhn3vrze>Already have an account? <a href="/login" data-astro-cid-vhn3vrze>Sign in here</a></p> <a href="/" class="back-link" data-astro-cid-vhn3vrze>← Back to Shadow Warden AI</a> </div> <script>(function(){const API = "/api";

    const form      = document.getElementById('signup-form');
    const submitBtn = document.getElementById('submit-btn');
    const errorMsg  = document.getElementById('error-msg');
    const pwInput   = document.getElementById('password');
    const confirmInput = document.getElementById('confirm');
    const confirmHint  = document.getElementById('confirm-hint');
    const pwStrength   = document.getElementById('pw-strength');
    const pwLabel      = document.getElementById('pw-label');
    const bars = [
      document.getElementById('pw-bar-1'),
      document.getElementById('pw-bar-2'),
      document.getElementById('pw-bar-3'),
      document.getElementById('pw-bar-4'),
    ];
    const COLORS = ['#ef4444', '#ea580c', '#eab308', '#059669'];
    const LABELS = ['Weak', 'Fair', 'Good', 'Strong'];

    // If already logged in (sw_logged_in indicator cookie present), skip to marketplace
    if (document.cookie.split(';').some(c => c.trim() === 'sw_logged_in=1')) {
      window.location.replace('/agentic');
    }

    // Password strength meter
    pwInput.addEventListener('input', () => {
      const v = pwInput.value;
      pwStrength.style.display = v ? 'flex' : 'none';
      let score = 0;
      if (v.length >= 8)  score++;
      if (v.length >= 12) score++;
      if (/[A-Z]/.test(v) && /[0-9]/.test(v)) score++;
      if (/[^A-Za-z0-9]/.test(v)) score++;
      bars.forEach((b, i) => {
        b.style.background = i <= score - 1 ? COLORS[score - 1] : 'rgba(255,255,255,0.08)';
      });
      pwLabel.textContent = score > 0 ? LABELS[score - 1] : '';
      pwLabel.style.color = score > 0 ? COLORS[score - 1] : '#64748b';
    });

    // Confirm password match check
    confirmInput.addEventListener('input', () => {
      const mismatch = confirmInput.value && confirmInput.value !== pwInput.value;
      confirmInput.classList.toggle('error', !!mismatch);
      confirmHint.classList.toggle('visible', !!mismatch);
    });

    form.addEventListener('submit', async (e) => {
      e.preventDefault();

      const email    = document.getElementById('email').value.trim();
      const password = pwInput.value;
      const confirm  = confirmInput.value;

      if (!email || !password || !confirm) {
        showError('Please fill in all fields.');
        return;
      }
      if (password !== confirm) {
        confirmInput.classList.add('error');
        confirmHint.classList.add('visible');
        return;
      }
      if (password.length < 8) {
        showError('Password must be at least 8 characters.');
        return;
      }

      submitBtn.disabled = true;
      submitBtn.innerHTML = '<span class="spinner"></span>';
      errorMsg.style.display = 'none';

      try {
        const res = await fetch(API + '/auth/signup', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password }),
        });

        if (res.ok) {
          window.location.replace('/agentic');
          return;
        }

        const data = await res.json().catch(() => ({}));
        if (res.status === 409) {
          showError('An account with this email already exists. Try signing in.');
        } else if (res.status === 422) {
          showError(data.detail || 'Please check your email and password.');
        } else if (res.status === 429) {
          showError('Too many attempts. Please wait a few minutes and try again.');
        } else {
          showError(data.detail || 'Registration failed. Please try again.');
        }
      } catch {
        showError('Could not reach the server. Check your connection.');
      } finally {
        submitBtn.disabled = false;
        submitBtn.textContent = 'Create Account';
      }
    });

    function showError(msg) {
      errorMsg.textContent = msg;
      errorMsg.style.display = 'block';
    }
  })();</script> </body> </html>
