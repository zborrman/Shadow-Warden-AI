# Shadow Warden AI — Helm values
#
# SW-13: this chart deploys only the warden gateway, redis, the arq worker and
# the secrets it needs. It does not deploy the app, analytics, dashboard,
# caddy, postgres, minio, prometheus, grafana or an ingress — those run from
# `docker-compose.yml`, and Kubernetes users bring their own.
#
# Nine such blocks used to be configured here, each with an image, resource
# limits and `enabled: true`, and no template read any of them. `helm lint` and
# `helm template` both passed the whole time: a values block with no template
# behind it is syntactically perfect and deploys nothing. Adding a component
# here means adding its template in the same change —
# `warden/tests/test_helm_values_render.py` fails otherwise.
#
# Override per environment: helm upgrade -f values.prod.yaml

global:
  image:
    registry: ghcr.io/zborrman
    tag: "6.3"
    pullPolicy: IfNotPresent
  storageClass: ""

# ── Warden (core API, port 8001) ───────────────────────────────────────────────
warden:
  enabled: true
  replicas: 2
  image:
    repository: shadow-warden-ai/warden
  resources:
    requests: { cpu: "250m", memory: "512Mi" }
    limits:   { cpu: "1",    memory: "1Gi"   }
  env:
    ALLOW_UNAUTHENTICATED: "false"
    STRICT_MODE: "true"
    REDIS_URL: "redis://redis:6379"
    OTEL_ENABLED: "false"
  service:
    port: 8001
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 10
    targetCPUUtilizationPercentage: 70
redis:
  enabled: true
  image:
    repository: redis
    tag: "7-alpine"
  resources:
    requests: { cpu: "100m", memory: "128Mi" }
    limits:   { cpu: "500m", memory: "512Mi" }
  persistence:
    enabled: true
    size: 4Gi
  service:
    port: 6379
arqWorker:
  enabled: true
  replicas: 1
  image:
    repository: shadow-warden-ai/warden
  resources:
    requests: { cpu: "100m", memory: "256Mi" }
    limits:   { cpu: "500m", memory: "1Gi"   }
  keda:
    enabled: false
    redisQueueLength: 10

# ── Secrets (override with --set or -f values.secret.yaml; never commit real values) ──
secrets:
  wardenApiKey: ""
  anthropicApiKey: ""
  vaultMasterKey: ""
  postgresPassword: "changeme"
  minioRootPassword: "changeme"
  slackWebhookUrl: ""
  sovereignAttestKey: ""
