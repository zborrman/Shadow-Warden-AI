[project]
name = "shadow-warden-ai"
# P-1: single version of record — read from warden/__init__.py::__version__.
# Hardcoding it here is what let the wheel drift to 5.3.0 while the package said
# 5.6.0 and the product shipped 7.7. See [tool.setuptools.dynamic] below.
dynamic = ["version"]
description = "AI security gateway — jailbreak detection, PII/secret redaction, STIX 2.1 audit chain, SMB AI governance suite, business intelligence, post-quantum cryptography, sovereign cloud routing, and self-improving rules powered by Claude Opus"
readme = "README.md"
requires-python = ">=3.11,<4.0"
license = { text = "Proprietary" }
keywords = ["ai-safety", "llm", "security", "jailbreak", "prompt-injection", "gdpr"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Topic :: Security",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "fastapi>=0.136.0",   # migrated to starlette 1.x (see warden/requirements.txt)
    "starlette>=1.0.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.7.0",
    "python-multipart>=0.0.9",
    "sentence-transformers>=3.0.0",
    "numpy>=1.26.0",
    "anthropic>=0.40.0",
    "playwright>=1.44.0",
    "streamlit>=1.35.0",
    "plotly>=5.22.0",
    "stripe>=8.0.0",
    "bcrypt>=4.0.0",
    "slowapi>=0.1.9",
    "redis>=5.0.0",
    "httpx>=0.27.0",
    "prometheus-fastapi-instrumentator>=8.0.0",   # >=8.0 drops the starlette<1.0 cap
    "prometheus-client>=0.20.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "mutmut>=2.4.0",
]
langchain = [
    "langchain-core>=0.1.0",
    "httpx>=0.27.0",
]
smb = [
    # SMB AI Governance Suite (BL-22/23/24, CM-35/36/37/38, IN-25)
    # All modules use stdlib SQLite — no extra deps required.
    # Install for the complete governance stack docs + type stubs:
    "shadow-warden-ai",
]
bi = [
    # Business Intelligence Module (CM-39)
    # Pure-Python OLS + benchmarking — no numpy/scipy required at runtime.
    "shadow-warden-ai",
]
pqc = [
    # Post-Quantum Cryptography (liboqs required for ML-DSA-65 + ML-KEM-768)
    # Falls back to classical Ed25519/X25519 if not installed.
    "liboqs-python>=0.9.0",
]
sovereign = [
    # Sovereign AI Cloud routing — no extra deps beyond core.
    "shadow-warden-ai",
]
otel = [
    # OpenTelemetry distributed tracing
    "opentelemetry-sdk>=1.25.0",
    "opentelemetry-exporter-otlp-proto-grpc>=1.25.0",
    "opentelemetry-instrumentation-fastapi>=0.46b0",
]
full = [
    # All optional features bundled
    "shadow-warden-ai[langchain,pqc,otel]",
    "liboqs-python>=0.9.0",
    "opentelemetry-sdk>=1.25.0",
    "opentelemetry-exporter-otlp-proto-grpc>=1.25.0",
    "opentelemetry-instrumentation-fastapi>=0.46b0",
    "langchain-core>=0.1.0",
]

[project.scripts]
warden-gateway   = "warden.main:main"
warden-dashboard = "warden.analytics.dashboard:main"
warden-hash      = "warden.analytics.auth:__main__"

[project.urls]
Homepage   = "https://github.com/zborrman/Shadow-Warden-AI"
Repository = "https://github.com/zborrman/Shadow-Warden-AI"
Issues     = "https://github.com/zborrman/Shadow-Warden-AI/issues"

[build-system]
requires      = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.dynamic]
version = { attr = "warden.__version__" }

[tool.setuptools.packages.find]
where = ["."]
include = ["warden*", "analytics*"]

# ── Ruff (linter) ─────────────────────────────────────────────────────────────

[tool.ruff]
line-length    = 100
target-version = "py311"

[tool.ruff.lint]
select  = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM"]
ignore  = ["E501", "B008"]   # E501=line length (ruff handles it), B008=FastAPI Depends()

[tool.ruff.lint.isort]
known-first-party = ["warden", "analytics"]

[tool.ruff.lint.per-file-ignores]
"warden/tests/*" = ["S101"]                    # assert is expected in tests
"warden/analytics/dashboard.py"     = ["C408"]    # Plotly uses dict() kwargs by convention
"warden/analytics/msp_dashboard.py" = ["C408"]    # Plotly uses dict() kwargs by convention

# ── Mypy ─────────────────────────────────────────────────────────────────────

[tool.mypy]
python_version         = "3.11"
ignore_missing_imports = true
strict                 = false

# ── Coverage ──────────────────────────────────────────────────────────────────
# Omit files that are UI layers or require live external services to exercise:
#   dashboard / auth    — Streamlit UI; not unit-testable without a running browser
#   siem                — Splunk / Elastic endpoints unavailable in CI
#   langchain_callback  — requires langchain runtime
#   browser             — Playwright headful browser (CI has no display)
#   openai_proxy        — proxy to OpenAI; requires a live backend

[tool.coverage.run]
omit = [
    "warden/analytics/dashboard.py",
    "warden/analytics/auth.py",
    "warden/analytics/siem.py",
    "warden/analytics/msp_dashboard.py",
    "warden/integrations/langchain_callback.py",
    "warden/integrations/nemo_bridge.py",
    "warden/integrations/taxii.py",
    "warden/tools/browser.py",
    "warden/openai_proxy.py",
    "warden/agent/tools.py",
    "warden/agent/master.py",
    "warden/agent/scheduler.py",
    "warden/agent/healer.py",
    "warden/portal_router.py",
    "warden/shadow_ai/discovery.py",
    "warden/workers/probe_worker.py",
    "warden/workers/reaper.py",
    "warden/workers/settings.py",
    "warden/workers/cve_scanner.py",
    "warden/workers/content_filter.py",
    "warden/workers/settings_watcher.py",
    "warden/db/migrations/*",
    "warden/brain/faiss_index.py",
    "warden/agent/sova.py",
    "warden/analytics/accessibility.py",
    "warden/audio_redactor.py",
    "warden/api/monitor.py",
    "warden/blockchain/chain_connector.py",
    "warden/blockchain/ipfs_storage.py",
    "warden/blockchain/mandate_contract.py",
    "warden/api/fido_auth.py",
    "warden/semantic_layer/api.py",
    "warden/analytics/pages/14_Agentic_Commerce.py",
    "warden/analytics/pages/15_Semantic_Layer.py",
    "warden/analytics/pages/16_Settings.py",
    "warden/workers/weekly_report.py",
    "warden/image_guard.py",
    "warden/audio_guard.py",
    "warden/image_redactor.py",
    "warden/image_synth.py",
    "warden/multimodal.py",
]

[tool.coverage.report]
exclude_lines = [
    "if __name__ == .__main__.:",
    "pragma: no cover",
    "raise NotImplementedError",
]

# ── Pytest ────────────────────────────────────────────────────────────────────

[tool.pytest.ini_options]
testpaths    = ["warden/tests", "warden/m2m_store/tests", "warden/business_intelligence/tests"]
addopts      = "-v --tb=short --strict-markers --cov=warden --cov-report=term-missing --cov-fail-under=83"
markers      = [
    "adversarial: adversarial corpus tests (may be slow)",
    "slow: tests that load the ML model",
    "integration: end-to-end FastAPI tests",
    "chaos: chaos/fault-injection tests",
]
asyncio_mode = "auto"

# ── Mutmut (mutation testing) ─────────────────────────────────────────────────
# SR-7.3: extended beyond the original two core safety modules to the
# security-critical modules named in the roadmap (auth_guard, causal_arbiter,
# x402_gate) — everything else is glue.
# Fast unit tests only (no ML model, no slow fixtures).
# Threshold: < 20 surviving mutants per module = acceptable (per CI docs below).
# Run: mutmut run  (Linux / WSL / CI only — not supported on native Windows)
#
# ⚠️ Schema note (2026-08-02): warden/constraints.txt pins mutmut==3.6.0, which
# dropped the 2.x `paths_to_mutate` (comma-string) / `runner` (shell command) /
# `tests_dir` (string) keys — `mutmut run` crashed with a TypeError on any
# config using them (tests_dir + a list requires tests_dir to itself be a
# list, not a string; concatenating a list with a string raises). This had
# apparently never been re-verified after the constraints.txt bump to 3.x, so
# mutation testing was silently non-functional. Rewritten below for the 3.x
# schema: `source_paths` (list), `pytest_add_cli_args_test_selection` (list of
# test files/dirs, replaces `runner`+`tests_dir`), `pytest_add_cli_args` (list
# of extra flags, replaces the shell-command parts of the old `runner`).
[tool.mutmut]
source_paths = [
    "warden/secret_redactor.py",
    "warden/semantic_guard.py",
    "warden/auth_guard.py",
    "warden/causal_arbiter.py",
    "warden/marketplace/x402_gate.py",
]
pytest_add_cli_args_test_selection = [
    "warden/tests/test_secret_redactor.py",
    "warden/tests/test_semantic_guard.py",
    "warden/tests/test_auth_guard.py",
    "warden/tests/test_causal_arbiter.py",
    "warden/tests/test_causal_c1_guardrail.py",
    "warden/tests/test_causal_online.py",
    "warden/tests/test_x402_gate.py",
]
pytest_add_cli_args = ["-x", "-q", "--no-header", "--no-cov"]
# NOTE (2026-08-03): the two bugs below were not hypothetical — this config
# previously reached this point uncommitted, and every attempt to actually
# `mutmut run` it failed. Fixed both; see the CLAUDE.md mutation-testing note
# for the current status of a full 5-module sweep (large mutant population,
# in progress, not yet a CI gate).
#
# also_copy's built-in defaults only look for top-level tests/ or test/ dirs
# (a bare `Path("tests/")`) — this repo's suite lives at warden/tests/, which
# the mutants sandbox otherwise never receives, so every mutant run failed
# with "file or directory not found" (pytest exit 4) before this was added.
#
# The transitive closure of every `from warden...` import reached by the 5
# source_paths files + their test files, traced by hand (mutmut's mutants/
# sandbox is NOT merged with the real source tree by Python's import system —
# it is its own isolated copy; also_copy runs BEFORE source_paths mutation is
# written, so listing these does not clobber the mutated/trampoline versions
# of the 5 files above):
#   secret_redactor, semantic_guard  -> schemas, telemetry -> config
#   auth_guard                       -> config
#   causal_arbiter                   -> observability -> metrics
#   marketplace/x402_gate            -> config, db/connect -> db/ddl_registry,
#                                        db/sqlite_pragmas; payments/x402_balance
#   test_auth_guard (conditional)    -> auth/oidc_guard -> observability
# `warden/__init__.py` (and each subpackage's own __init__.py) must come along
# too, or `warden.db`/`warden.marketplace`/`warden.payments`/`warden.auth`
# won't resolve as packages at all under the isolated copy.
#
# Deliberately NOT `also_copy = ["warden"]`: warden/models/ alone is 162 MB of
# ONNX/MiniLM weights these 5 modules never touch, and copying it wholesale
# for every run cost several minutes on a Windows bind mount for zero benefit.
#
# Subpackages (db/, payments/, auth/, marketplace/) are listed as whole
# directories, not individual files: mutmut's also_copy uses shutil.copy2 for
# file entries, which does NOT create missing parent directories — listing
# "warden/db/__init__.py" alone crashes with FileNotFoundError because
# mutants/warden/db/ doesn't exist yet. Directory entries use copytree, which
# creates their own path. All four are small (103K-1.5M) so copying each
# wholesale (a few unused sibling files along for the ride) costs nothing.
#
# Do not "fix" this by running against a Docker image that already has warden
# installed (e.g. this repo's own built image) as a shortcut to skip also_copy:
# warden/Dockerfile sets `ENV PYTHONPATH=/` with `WORKDIR /warden`, so `/warden`
# (a regular package with __init__.py) wins Python's namespace-package
# resolution over the mutants/ overlay outright — every mutant then silently
# runs against the ORIGINAL unmutated code and reports as trivially "killed".
# Confirmed by direct comparison: baked /warden/secret_redactor.py was
# byte-identical to source, zero mutant markers, while tests still "passed".
# Run mutmut in a plain interpreter (no PYTHONPATH override) with only the
# packages these 5 modules + their tests need: pytest, pytest-asyncio,
# pytest-cov, httpx, pyjwt, pydantic>=2, fastapi>=0.110.
also_copy = [
    "warden/tests/",
    "warden/__init__.py",
    "warden/schemas.py",
    "warden/telemetry.py",
    "warden/config.py",
    "warden/observability.py",
    "warden/metrics.py",
    "warden/db/",
    "warden/payments/",
    "warden/auth/",
    "warden/marketplace/",
]
debug = true
