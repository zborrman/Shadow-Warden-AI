    const form = document.getElementById('login-form');
    const submitBtn = document.getElementById('submit-btn');
    const errorMsg = document.getElementById('error-msg');

    // If already logged in (sw_logged_in indicator cookie present), skip to marketplace
    if (document.cookie.split(';').some(c => c.trim() === 'sw_logged_in=1')) {

      submitBtn.disabled = true;
      submitBtn.innerHTML = '<span class="spinner"></span>';
      errorMsg.style.display = 'none';

      try {

          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password }),

        if (res.ok) {
          window.location.replace('/agentic');
          return;

        const data = await res.json().catch(() => ({}));
        if (res.status === 503) {
          showError('Authentication is not yet configured. Contact your administrator.');

          showError('Incorrect email or password.');
        } else {
          showError(data.detail || 'An unexpected error occurred. Please try again.');
        }
      } catch (err) {
        showError('Could not reach the authentication server. Check your connection.');
