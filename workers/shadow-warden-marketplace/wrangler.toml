name = "shadow-warden-marketplace"
main = "src/index.ts"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

[vars]
ALLOWED_ORIGIN = "https://shadow-warden-ai.com"

# KV binding removed in v2.0.0: this Worker is a proxy and owns no state.
# The namespace still exists but is no longer served — see src/index.ts.

# Secrets (set via wrangler secret put):
#   WARDEN_BACKEND_URL  — https://api.shadow-warden-ai.com

[[routes]]
pattern = "marketplace.shadow-warden-ai.com/*"
zone_name = "shadow-warden-ai.com"

[observability]
enabled = true
