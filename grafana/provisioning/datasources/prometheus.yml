apiVersion: 1

# ── Existing-install migration (OB-1 follow-up) ──────────────────────────────
# Grafana matches a provisioned datasource to an existing row by NAME, then
# tries to look the row up by the uid in this file. Pinning `uid:` on an install
# whose grafana.db already holds Prometheus/Loki under generated uids therefore
# fails with "Datasource provisioning error: data source not found", and Grafana
# **exits(1) in a restart loop** — it does not degrade, it refuses to start.
#
# Observed on production 2026-08-16 immediately after the OB track deployed. It
# never appeared in pre-merge verification because every check ran against a
# fresh volume, where there is no prior row to collide with.
#
# deleteDatasources runs before datasources, so the old rows are removed and
# re-created with the pinned uids. This is idempotent: on a fresh install the
# deletes are no-ops, and on an already-migrated install the names match rows
# that already carry the right uid.
#
# Keep this block. Removing it once production is migrated would only re-open
# the same failure for any other install, and it costs nothing here.
deleteDatasources:
  - name: Prometheus
    orgId: 1
  - name: Loki
    orgId: 1
  - name: Jaeger
    orgId: 1

datasources:

  # ── Prometheus — metrics ─────────────────────────────────────────────────
  #
  # `uid` MUST stay pinned. Provisioned alert rules bind their queries by
  # datasource UID, not by name (see provisioning/alerting/warden_alerts.yml).
  # With no `uid` here Grafana generates a random one at first boot, every
  # rule fails to resolve its datasource, and the whole alerting layer errors
  # instead of firing — silently, because a rule that cannot evaluate looks
  # exactly like a rule that is not breaching.
  - name: Prometheus
    type: prometheus
    uid: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false
    jsonData:
      timeInterval: "15s"
      queryTimeout: "60s"
      httpMethod: POST

  # ── Loki — logs ──────────────────────────────────────────────────────────
  - name: Loki
    type: loki
    uid: loki
    access: proxy
    url: http://loki:3100
    editable: false
    jsonData:
      maxLines: 1000

      # ── OB-9: log → trace ────────────────────────────────────────────────
      # Turns the trace_id in a log line into a click through to that trace.
      # This could not exist before OB-9: warden's _JsonFormatter emitted only
      # ts/level/logger/message, so no log record and no span shared any value
      # — logs and traces were two disconnected stores.
      #
      # A derived field reads the log LINE, not a Loki label, which is what we
      # want: trace_id is high-cardinality and must never become a label or it
      # explodes Loki's index. `risk_level` is the opposite — bounded, so
      # promtail promotes that one.
      #
      # Degrades cleanly: OTel is opt-in (OTEL_ENABLED=false by default), and
      # with it off no line carries a trace_id, so the field simply never
      # matches rather than producing a broken link.
      derivedFields:
        - name: TraceID
          matcherRegex: '"trace_id":\s*"([0-9a-f]{32})"'
          # $$ escapes Grafana's provisioning-time env interpolation; a single
          # $ would be resolved as an environment variable named
          # `__value.raw`, resolve to empty, and the link would go nowhere.
          url: '$${__value.raw}'
          datasourceUid: jaeger
          urlDisplayLabel: 'View trace'

  # ── Jaeger — traces ──────────────────────────────────────────────────────
  # OB-9. Traces have been reaching Jaeger through the OTel collector all
  # along, but Grafana had no trace datasource, and Jaeger's own UI is bound to
  # 127.0.0.1 — so traces were reachable only over an SSH tunnel, in a separate
  # tool, with no way to arrive from the metric or log that prompted the
  # question. Grafana proxies to it over the compose network, so the host port
  # stays loopback-only.
  - name: Jaeger
    type: jaeger
    uid: jaeger
    access: proxy
    url: http://jaeger:16686
    editable: false
    jsonData:
      # ── trace → logs, the return leg ─────────────────────────────────────
      # From a span, jump to the log lines carrying the same trace_id. The
      # window is widened either side because a log line is written at a
      # slightly different instant than the span it belongs to.
      tracesToLogsV2:
        datasourceUid: loki
        spanStartTimeShift: '-5m'
        spanEndTimeShift: '5m'
        filterByTraceID: true
        filterBySpanID: false
        tags:
          - key: 'service.name'
            value: 'service'
