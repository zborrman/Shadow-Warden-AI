apiVersion: 1

# ── Shadow Warden AI — Grafana Alerting Rules ────────────────────────────────
#
# Two SLO-based alerts:
#
#   1. HighErrorRate  — HTTP 5xx rate > 1 % over 5 min
#      Fires when the gateway is returning server errors at a rate
#      that suggests a systemic fault (model failure, OOM, etc.).
#
#   2. HighP99Latency — /filter P99 latency > 500 ms over 5 min
#      Fires when the 99th-percentile response time for the primary
#      filter endpoint breaches the 500 ms SLO.
#
# Both alerts are in the "Shadow Warden" folder and use the
# "WardenAlerts" contact point (configure in Grafana UI or add a
# contactPoints section below to wire up Slack / PagerDuty).
# ─────────────────────────────────────────────────────────────────────────────

groups:
  - orgId: 1
    name: warden_slo
    folder: Shadow Warden
    interval: 1m   # evaluate every minute
    rules:

      # ── 1. High HTTP Error Rate ──────────────────────────────────────────────
      - uid: warden-high-error-rate
        title: "Warden — High Error Rate (> 1%)"
        condition: C

        data:
          # A: total requests in the last 5 minutes
          - refId: A
            queryType: ""
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              expr: >
                sum(rate(http_requests_total{job="warden"}[5m]))
              intervalMs: 15000
              maxDataPoints: 43200
              instant: true

          # B: 5xx requests in the last 5 minutes
          - refId: B
            queryType: ""
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              expr: >
                sum(rate(http_requests_total{job="warden", status=~"5.."}[5m]))
              intervalMs: 15000
              maxDataPoints: 43200
              instant: true

          # C: error rate > 1 %
          - refId: C
            queryType: ""
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: __expr__
            model:
              type: math
              expression: "$B / $A > 0.01"

        noDataState: OK
        execErrState: Alerting
        for: 5m
        labels:
          severity: critical
          team: warden
        annotations:
          summary: "Warden error rate above 1%"
          description: >
            HTTP 5xx responses have exceeded 1% of total traffic for 5 minutes.
            Check warden container logs and /health endpoint.
            Dashboard: http://localhost:3000/d/warden-overview

      # ── 2. High P99 Latency on /filter ───────────────────────────────────────
      - uid: warden-high-p99-latency
        title: "Warden — /filter P99 latency > 500 ms"
        condition: C

        data:
          # A: P99 latency for /filter endpoint
          - refId: A
            queryType: ""
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              expr: >
                histogram_quantile(
                  0.99,
                  sum by (le) (
                    rate(http_request_duration_seconds_bucket{
                      job="warden",
                      handler="/filter"
                    }[5m])
                  )
                )
              intervalMs: 15000
              maxDataPoints: 43200
              instant: true

          # C: latency > 0.5 s
          - refId: C
            queryType: ""
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: __expr__
            model:
              type: math
              expression: "$A > 0.5"

        noDataState: OK
        execErrState: Alerting
        for: 5m
        labels:
          severity: warning
          team: warden
        annotations:
          summary: "Warden /filter P99 latency above 500ms"
          description: >
            The 99th-percentile latency for POST /filter has exceeded 500ms
            for 5 consecutive minutes.  Likely cause: ML model contention or
            Redis cache miss storm.
            This is the gross-outlier alarm, an order of magnitude above the
            published SLO; warden-p99-slo-breach below is the one that tracks
            the 50 ms commitment in docs/sla.md.

      # ── The SLO we actually sell (OB-5) ─────────────────────────────────────
      # This rule could not exist before OB-5. The per-handler histogram shipped
      # with buckets of 0.1 / 0.5 / 1 s, so every sub-100 ms request fell into
      # the first bucket and histogram_quantile had no resolution to answer
      # "is P99 under 50 ms" — the exact question docs/sla.md answers to
      # customers. With SLO-bracketed edges in place, it does.
      - uid: warden-p99-slo-breach
        title: "Warden — /filter P99 above the 50 ms SLO"
        condition: C
        data:
          - refId: A
            queryType: ""
            relativeTimeRange:
              from: 900
              to: 0
            datasourceUid: prometheus
            model:
              expr: >
                histogram_quantile(
                  0.99,
                  sum by (le) (
                    rate(http_request_duration_seconds_bucket{
                      job="warden",
                      handler="/filter"
                    }[15m])
                  )
                )
              intervalMs: 15000
              maxDataPoints: 43200
              instant: true
          - refId: C
            queryType: ""
            relativeTimeRange:
              from: 900
              to: 0
            datasourceUid: __expr__
            model:
              type: math
              expression: "$A > 0.05"
        # No traffic means the SLO is unmeasured, not breached. A 15m window and
        # a 10m hold keep this off a quiet gateway and off single slow requests.
        noDataState: OK
        execErrState: OK
        for: 10m
        labels:
          severity: warning
          team: warden
          category: slo
        annotations:
          summary: "P99 latency on /filter has been above the published 50 ms SLO for 10 minutes"
          description: >
            docs/sla.md commits Pro to 99.9% uptime and P99 < 50 ms; Enterprise to
            99.95%. This is a service-credit exposure, not an outage — page-worthy
            only if it persists or coincides with warden-high-p99-latency.
            Check ML model contention, Redis cache hit rate, and whether the
            HyperbolicBrain stage is falling back to a cold model load.
            Dashboard: http://localhost:3000/d/warden-overview

      # ── 3. Corpus Canary Failure (Self-Healing trigger) ───────────────────────
      - uid: warden-canary-failing
        title: "Warden — Corpus Canary Failure (poisoning suspected)"
        condition: C

        data:
          - refId: A
            queryType: ""
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              expr: "warden_corpus_canary_failing"
              intervalMs: 15000
              maxDataPoints: 43200
              instant: true

          - refId: C
            queryType: ""
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: __expr__
            model:
              type: math
              expression: "$A > 0"

        noDataState: OK
        execErrState: Alerting
        for: 0s
        labels:
          severity: critical
          team: warden
          category: corpus_poisoning
        annotations:
          summary: "Corpus canary examples failing — poisoning suspected"
          description: >
            One or more of the 10 canary examples now scores below 0.70
            against the threat corpus.  Self-Healing rollback has been
            triggered automatically.  Review CorpusHealthMonitor logs and
            check for suspicious Evolution Engine activity.
            Dashboard: http://localhost:3000/d/ai-security-health

      # ── 4. Corpus Centroid Drift ──────────────────────────────────────────────
      - uid: warden-corpus-drift
        title: "Warden — Corpus centroid drift exceeds threshold"
        condition: C

        data:
          - refId: A
            queryType: ""
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              expr: "warden_corpus_drift_score"
              intervalMs: 15000
              maxDataPoints: 43200
              instant: true

          - refId: C
            queryType: ""
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: __expr__
            model:
              type: math
              expression: "$A > 0.08"

        noDataState: OK
        execErrState: Alerting
        for: 5m
        labels:
          severity: warning
          team: warden
          category: corpus_poisoning
        annotations:
          summary: "Corpus centroid has drifted beyond 0.08"
          description: >
            The cosine distance between the current corpus centroid and the
            baseline has exceeded 0.08 for 5 minutes.  This indicates the
            Evolution Engine may have absorbed adversarial examples that are
            gradually shifting the detection boundary toward benign space.
            Dashboard: http://localhost:3000/d/ai-security-health

      # ── 5. Availability SLO Breach (99.9% uptime) ────────────────────────────
      - uid: warden-availability-slo
        title: "Warden — Availability SLO breach (< 99.9% over 1h)"
        condition: C

        data:
          # A: successful requests in the last hour
          - refId: A
            queryType: ""
            relativeTimeRange:
              from: 3600
              to: 0
            datasourceUid: prometheus
            model:
              expr: >
                sum(rate(http_requests_total{job="warden", status!~"5.."}[1h]))
              intervalMs: 60000
              maxDataPoints: 720
              instant: true

          # B: all requests in the last hour
          - refId: B
            queryType: ""
            relativeTimeRange:
              from: 3600
              to: 0
            datasourceUid: prometheus
            model:
              expr: >
                sum(rate(http_requests_total{job="warden"}[1h]))
              intervalMs: 60000
              maxDataPoints: 720
              instant: true

          # C: success rate < 99.9 %
          - refId: C
            queryType: ""
            relativeTimeRange:
              from: 3600
              to: 0
            datasourceUid: __expr__
            model:
              type: math
              expression: "$A / $B < 0.999"

        noDataState: OK
        execErrState: Alerting
        for: 10m
        labels:
          severity: critical
          team: warden
          category: slo
        annotations:
          summary: "Warden availability below 99.9% SLO"
          description: >
            The success rate for all Warden endpoints has fallen below 99.9% over
            the past hour. This breaches the Enterprise SLA commitment.
            Immediate investigation required.
            Dashboard: http://localhost:3000/d/warden-overview

      # ── 6. Shadow Ban Rate Spike ───────────────────────────────────────────────
      - uid: warden-shadow-ban-spike
        title: "Warden — Shadow ban rate spike (> 0.2 bans/s)"
        condition: C

        data:
          - refId: A
            queryType: ""
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              expr: >
                sum(rate(warden_shadow_ban_total[5m]))
              intervalMs: 15000
              maxDataPoints: 43200
              instant: true

          # C: > 0.2 shadow bans per second = 12 per minute
          - refId: C
            queryType: ""
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: __expr__
            model:
              type: math
              expression: "$A > 0.2"

        noDataState: OK
        execErrState: OK
        for: 3m
        labels:
          severity: warning
          team: warden
          category: attack_volume
        annotations:
          summary: "High shadow ban rate — likely active attack campaign"
          description: >
            Shadow ban events are firing at > 12 per minute for 3 consecutive minutes.
            This indicates a sustained automated attack campaign targeting this Warden
            instance. Review ERS scores and consider temporary IP-level blocks upstream.
            Dashboard: http://localhost:3000/d/warden-overview

      # ── 5. Data Poisoning Spike ───────────────────────────────────────────────
      - uid: warden-poisoning-spike
        title: "Warden — Data poisoning attack spike"
        condition: C

        data:
          - refId: A
            queryType: ""
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              expr: >
                sum(rate(warden_poisoning_attempts_total[5m]))
              intervalMs: 15000
              maxDataPoints: 43200
              instant: true

          - refId: C
            queryType: ""
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: __expr__
            model:
              type: math
              expression: "$A > 0.1"

        noDataState: OK
        execErrState: Alerting
        for: 2m
        labels:
          severity: critical
          team: warden
          category: corpus_poisoning
        annotations:
          summary: "Data poisoning rate above 6 attempts / minute"
          description: >
            The rate of data poisoning detections has exceeded 0.1 req/s
            (6 per minute) for 2 consecutive minutes.  This may indicate
            an automated boundary-probing or adversarial-perturbation
            campaign targeting this Warden instance.
            Dashboard: http://localhost:3000/d/ai-security-health

      # ── 7. SLO Burn-Rate — Fast Burn (Critical / Page Now) ───────────────────
      #
      # Google SRE multi-window burn-rate alert.
      # SLO: 99.9% availability → error budget = 0.1% = 43.8 min/month.
      #
      # Fast burn: if the error rate exceeds 14.4× the SLO budget rate,
      # 2% of the monthly error budget is consumed in just 1 hour.
      # Multi-window (1h + 5min) eliminates false positives from short spikes.
      #
      # burn_rate = actual_error_rate / slo_error_rate
      #           = error_rate / 0.001
      # Threshold: 14.4 → page immediately, 2% budget consumed in 1h
      #
      - uid: warden-burn-fast
        title: "Warden — SLO Burn Rate FAST (> 14.4×, page now)"
        condition: D

        data:
          # A: error rate over 1h window
          - refId: A
            queryType: ""
            relativeTimeRange:
              from: 3600
              to: 0
            datasourceUid: prometheus
            model:
              expr: >
                sum(rate(http_requests_total{job="warden", status=~"5.."}[1h]))
                /
                sum(rate(http_requests_total{job="warden"}[1h]))
              intervalMs: 60000
              maxDataPoints: 720
              instant: true

          # B: error rate over 5min window (short window to confirm fast burn)
          - refId: B
            queryType: ""
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              expr: >
                sum(rate(http_requests_total{job="warden", status=~"5.."}[5m]))
                /
                sum(rate(http_requests_total{job="warden"}[5m]))
              intervalMs: 15000
              maxDataPoints: 43200
              instant: true

          # C: 1h burn rate > 14.4× SLO (0.001 * 14.4 = 0.0144)
          - refId: C
            queryType: ""
            relativeTimeRange:
              from: 3600
              to: 0
            datasourceUid: __expr__
            model:
              type: math
              expression: "$A > 0.0144"

          # D: both windows must fire (AND gate — prevents false positives)
          - refId: D
            queryType: ""
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: __expr__
            model:
              type: math
              expression: "$C == 1 && $B > 0.0144"

        noDataState: OK
        execErrState: Alerting
        for: 2m
        labels:
          severity: critical
          team: warden
          category: slo_burn
          window: fast
        annotations:
          summary: "Warden SLO fast burn — 2% error budget consumed in 1h"
          description: >
            CRITICAL: The error rate has exceeded 14.4× the SLO budget rate
            (confirmed on both 1h and 5min windows). At this rate, 2% of the
            monthly error budget is consumed every hour — the entire monthly
            budget will be gone in ~50 hours.
            Immediate investigation required.
            Runbook: docs.shadow-warden-ai.com/guides/slo-burn-runbook
            Dashboard: http://localhost:3000/d/warden-overview

      # ── 8. SLO Burn-Rate — Slow Burn (Warning / Ticket) ─────────────────────
      #
      # Slow burn: if the error rate exceeds 6× the SLO budget rate,
      # 5% of the monthly error budget is consumed in 6 hours.
      # Multi-window (6h + 30min) reduces noise from transient dips.
      #
      # Threshold: 6 → file a ticket, investigate within business hours
      #
      - uid: warden-burn-slow
        title: "Warden — SLO Burn Rate SLOW (> 6×, file ticket)"
        condition: D

        data:
          # A: error rate over 6h window
          - refId: A
            queryType: ""
            relativeTimeRange:
              from: 21600
              to: 0
            datasourceUid: prometheus
            model:
              expr: >
                sum(rate(http_requests_total{job="warden", status=~"5.."}[6h]))
                /
                sum(rate(http_requests_total{job="warden"}[6h]))
              intervalMs: 60000
              maxDataPoints: 720
              instant: true

          # B: error rate over 30min window (short window confirmation)
          - refId: B
            queryType: ""
            relativeTimeRange:
              from: 1800
              to: 0
            datasourceUid: prometheus
            model:
              expr: >
                sum(rate(http_requests_total{job="warden", status=~"5.."}[30m]))
                /
                sum(rate(http_requests_total{job="warden"}[30m]))
              intervalMs: 60000
              maxDataPoints: 720
              instant: true

          # C: 6h burn rate > 6× SLO (0.001 * 6 = 0.006)
          - refId: C
            queryType: ""
            relativeTimeRange:
              from: 21600
              to: 0
            datasourceUid: __expr__
            model:
              type: math
              expression: "$A > 0.006"

          # D: both windows must exceed threshold
          - refId: D
            queryType: ""
            relativeTimeRange:
              from: 1800
              to: 0
            datasourceUid: __expr__
            model:
              type: math
              expression: "$C == 1 && $B > 0.006"

        noDataState: OK
        execErrState: OK
        for: 15m
        labels:
          severity: warning
          team: warden
          category: slo_burn
          window: slow
        annotations:
          summary: "Warden SLO slow burn — 5% error budget consumed in 6h"
          description: >
            WARNING: The error rate has exceeded 6× the SLO budget rate
            (confirmed on both 6h and 30min windows). At this rate, 5% of the
            monthly error budget is consumed every 6 hours.
            File a ticket and investigate during business hours.
            Runbook: docs.shadow-warden-ai.com/guides/slo-burn-runbook
            Dashboard: http://localhost:3000/d/warden-overview

      # ── R5: Redis Memory Near Cap ─────────────────────────────────────────────
      # redis-exporter:9121 already scraped (job "redis"). R5 set
      # maxmemory=1gb / maxmemory-policy=noeviction — at the cap, WRITEs start
      # failing (OOM command not allowed) rather than silently evicting
      # security-relevant keys (ERS scores, shadow-ban state, approval
      # tokens). This should fire well before that point.
      - uid: warden-redis-memory-high
        title: "Warden — Redis memory above 85% of maxmemory"
        condition: C
        data:
          - refId: A
            queryType: ""
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              # `and redis_memory_max_bytes > 0` is load-bearing (OB-8). Redis
              # reports maxmemory as 0 when no limit is configured — which is the
              # default, and is what this deployment runs. The bare ratio is then
              # used/0 = +Inf, which is > 85, so this rule sat in a firing
              # condition permanently. It was invisible only because the alerting
              # layer could not resolve its datasource (OB-F2); the moment OB-1
              # fixed that, it would have paged on a healthy Redis forever.
              #
              # With the guard, an unbounded Redis produces no series and the rule
              # goes NoData -> OK, which is correct: a Redis with no maxmemory
              # cannot be "above 85% of maxmemory".
              expr: >
                redis_memory_used_bytes / redis_memory_max_bytes * 100
                  and redis_memory_max_bytes > 0
              intervalMs: 15000
              maxDataPoints: 43200
              instant: true
          - refId: C
            queryType: ""
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: __expr__
            model:
              type: math
              expression: "$A > 85"
        noDataState: OK
        execErrState: OK
        for: 5m
        labels:
          severity: warning
          team: warden
          category: capacity
        annotations:
          summary: "Redis memory usage above 85% of the 1GB maxmemory cap"
          description: >
            Redis is approaching its maxmemory ceiling. Policy is noeviction, so
            further writes will start failing (not silently evict) once the cap
            is hit — check for a runaway key pattern (missing TTL) or genuine
            growth requiring a higher cap.

      # ── 9. Host Disk Usage High (R4) ─────────────────────────────────────────
      # Requires node-exporter running (COMPOSE_PROFILES=monitoring in prod
      # .env — profile-gated off by default for Windows/WSL2 dev, where the
      # required host-mount propagation isn't available). Prometheus already
      # scrapes node-exporter:9100 (job "node") regardless of whether the
      # target is actually up, so this alert simply has no data until the
      # profile is enabled — noDataState: OK below avoids a false page from
      # that dev-default gap, but "no data" here in prod means node-exporter
      # isn't running and should be investigated too.
      - uid: warden-host-disk-high
        title: "Warden — Host disk usage above 80%"
        condition: C
        data:
          - refId: A
            queryType: ""
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              expr: >
                (1 - node_filesystem_avail_bytes{mountpoint="/", fstype!="tmpfs"}
                / node_filesystem_size_bytes{mountpoint="/", fstype!="tmpfs"}) * 100
              intervalMs: 15000
              maxDataPoints: 43200
              instant: true
          - refId: C
            queryType: ""
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: __expr__
            model:
              type: math
              expression: "$A > 80"
        noDataState: OK
        execErrState: OK
        for: 10m
        labels:
          severity: warning
          team: warden
          category: disk
        annotations:
          summary: "Host root filesystem usage above 80%"
          description: >
            The VPS root filesystem has been above 80% used for 10 minutes.
            On the current 40GB disk this is ~8GB free. Check `docker system df`
            for reclaimable build cache/images, and Loki/ClickHouse volume
            growth (both have retention policies as of R4, but verify they're
            actually enforcing). Escalates to critical behavior (deploys
            failing, containers unable to start) well before 100%.

  - orgId: 1
    name: warden_domain
    folder: Shadow Warden
    interval: 1m
    rules:

      # ── 1. Marketplace — Escrow Stuck ─────────────────────────────────────────
      - uid: warden-marketplace-escrow-stuck
        title: "Warden — Marketplace escrow count stuck (> 50 for 30 min)"
        condition: B

        data:
          - refId: A
            queryType: ""
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              expr: "warden_marketplace_escrow_active"
              intervalMs: 15000
              maxDataPoints: 43200
              instant: true

          - refId: B
            queryType: ""
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: __expr__
            model:
              type: math
              expression: "$A > 50"

        noDataState: OK
        execErrState: OK
        for: 30m
        labels:
          severity: critical
          team: warden
          category: marketplace
        annotations:
          summary: "Marketplace escrow queue stuck above 50 active escrows"
          description: >
            The number of active escrows has exceeded 50 for 30 consecutive
            minutes. Indicates a processing backlog or settlement bug.
            Dashboard: http://localhost:3000/d/sw-marketplace

      # ── 2. Compliance — Score Drop ────────────────────────────────────────────
      - uid: warden-compliance-score-drop
        title: "Warden — Overall compliance score dropped below 70"
        condition: B

        data:
          - refId: A
            queryType: ""
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              expr: "min(warden_compliance_overall_score)"
              intervalMs: 15000
              maxDataPoints: 43200
              instant: true

          - refId: B
            queryType: ""
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: __expr__
            model:
              type: math
              expression: "$A < 70"

        noDataState: OK
        execErrState: OK
        for: 10m
        labels:
          severity: warning
          team: warden
          category: compliance
        annotations:
          summary: "Compliance posture score dropped below 70%"
          description: >
            Overall compliance score is below 70 for 10 minutes. Review the
            Compliance dashboard and remediate HIGH-severity gaps.
            Dashboard: http://localhost:3000/d/sw-compliance

      # ── 3. Compliance — Critical Gap Spike ───────────────────────────────────
      - uid: warden-compliance-gap-critical
        title: "Warden — More than 5 compliance gaps open"
        condition: B

        data:
          - refId: A
            queryType: ""
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              expr: "max(warden_compliance_gaps_open)"
              intervalMs: 15000
              maxDataPoints: 43200
              instant: true

          - refId: B
            queryType: ""
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: __expr__
            model:
              type: math
              expression: "$A > 5"

        noDataState: OK
        execErrState: Alerting
        for: 0s
        labels:
          severity: critical
          team: warden
          category: compliance
        annotations:
          summary: "More than 5 compliance gaps are open"
          description: >
            Total open compliance gaps exceeds 5. May indicate a regression or
            a deployment that has not been validated against governance rules.
            Dashboard: http://localhost:3000/d/sw-compliance

      # ── 4. Community — Peering Down ───────────────────────────────────────────
      - uid: warden-community-peer-down
        title: "Warden — All community peerings lost"
        condition: B

        data:
          - refId: A
            queryType: ""
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              expr: "warden_community_peering_connections"
              intervalMs: 15000
              maxDataPoints: 43200
              instant: true

          - refId: B
            queryType: ""
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: __expr__
            model:
              type: math
              expression: "$A == 0"

        noDataState: OK
        execErrState: OK
        for: 5m
        labels:
          severity: critical
          team: warden
          category: community
        annotations:
          summary: "All community peering connections have dropped to zero"
          description: >
            No active inter-community peering connections detected. SEP entity
            transfers will fail. Check the peering registry and MASQUE tunnels.
            Dashboard: http://localhost:3000/d/sw-community

      # ── 5. Community — No SEP Transfers ──────────────────────────────────────
      - uid: warden-community-sep-silent
        title: "Warden — No SEP transfers in 1 hour"
        condition: B

        data:
          - refId: A
            queryType: ""
            relativeTimeRange:
              from: 3600
              to: 0
            datasourceUid: prometheus
            model:
              expr: "increase(warden_community_sep_transfers_total[1h])"
              intervalMs: 60000
              maxDataPoints: 720
              instant: true

          - refId: B
            queryType: ""
            relativeTimeRange:
              from: 3600
              to: 0
            datasourceUid: __expr__
            model:
              type: math
              expression: "$A == 0"

        noDataState: OK
        execErrState: OK
        for: 0s
        labels:
          severity: warning
          team: warden
          category: community
        annotations:
          summary: "No SEP entity transfers in the last 1 hour"
          description: >
            Zero SEP transfers recorded in the last hour. May indicate a pipeline
            freeze, peering misconfiguration, or TransferGuard blocking all
            transfers at the Causal Arbiter stage.
            Dashboard: http://localhost:3000/d/sw-community

  - orgId: 1
    name: warden_voice
    folder: Shadow Warden
    interval: 1m
    rules:

      # ── Voice Latency ────────────────────────────────────────────────────────
      - uid: warden-voice-latency-high
        title: "Warden Voice — P95 Latency > 1500ms"
        condition: C
        # OB-6: explicit, not inherited. Grafana defaults an unset noDataState to
        # NoData, which raises a DatasourceNoData alert — and voice metrics are
        # legitimately absent whenever no voice session is running. With OB-3's
        # routing live that default would page on an idle subsystem.
        noDataState: OK
        execErrState: OK
        for: 5m
        labels:
          severity: warning
          category: voice
        annotations:
          summary: "Voice end-to-end latency P95 > 1500ms"
          description: >
            Voice pipeline P95 latency has exceeded 1500ms for 5 minutes.
            Investigate ASR provider latency, NLU processing time, or network congestion.
            Dashboard: http://localhost:3000/d/sw-voice
        data:
          - refId: A
            queryType: ""
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              expr: histogram_quantile(0.95, rate(warden_voice_e2e_latency_ms_bucket[5m]))
              intervalMs: 60000
              maxDataPoints: 43200
              refId: A
          - refId: C
            queryType: ""
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params: [1500]
                    type: gt
                  operator:
                    type: and
                  query:
                    params: [A]
                  reducer:
                    params: []
                    type: last
                  type: query
              refId: C
              type: classic_conditions

      # ── Voice Error Rate ─────────────────────────────────────────────────────
      - uid: warden-voice-error-rate-high
        title: "Warden Voice — Error Rate > 5%"
        condition: C
        # OB-6: explicit, not inherited. Grafana defaults an unset noDataState to
        # NoData, which raises a DatasourceNoData alert — and voice metrics are
        # legitimately absent whenever no voice session is running. With OB-3's
        # routing live that default would page on an idle subsystem.
        noDataState: OK
        execErrState: Alerting
        for: 5m
        labels:
          severity: critical
          category: voice
        annotations:
          summary: "Voice pipeline error rate > 5%"
          description: >
            More than 5% of voice sessions are encountering pipeline errors. Check
            warden_voice_errors_total{stage} for the failing stage (asr/nlu/tts/guardian).
            Dashboard: http://localhost:3000/d/sw-voice
        data:
          - refId: A
            queryType: ""
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              expr: rate(warden_voice_errors_total[5m]) / (rate(warden_voice_sessions_started_total[5m]) + 0.001)
              intervalMs: 60000
              maxDataPoints: 43200
              refId: A
          - refId: C
            queryType: ""
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params: [0.05]
                    type: gt
                  operator:
                    type: and
                  query:
                    params: [A]
                  reducer:
                    params: []
                    type: last
                  type: query
              refId: C
              type: classic_conditions

      # ── Deepfake Detection ───────────────────────────────────────────────────
      - uid: warden-voice-deepfake
        title: "Warden Voice — Deepfake Audio Detected"
        condition: C
        # OB-6: explicit, not inherited. Grafana defaults an unset noDataState to
        # NoData, which raises a DatasourceNoData alert — and voice metrics are
        # legitimately absent whenever no voice session is running. With OB-3's
        # routing live that default would page on an idle subsystem.
        noDataState: OK
        execErrState: Alerting
        labels:
          severity: critical
          category: voice
        annotations:
          summary: "Deepfake voice audio detected"
          description: >
            VoiceGuardian has detected synthetic/deepfake audio in the last 10 minutes.
            Review blocked sessions in the Voice Commerce dashboard.
            Dashboard: http://localhost:3000/d/sw-voice
        data:
          - refId: A
            queryType: ""
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              expr: increase(warden_voice_deepfake_detected_total[10m])
              intervalMs: 60000
              maxDataPoints: 43200
              refId: A
          - refId: C
            queryType: ""
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params: [0]
                    type: gt
                  operator:
                    type: and
                  query:
                    params: [A]
                  reducer:
                    params: []
                    type: last
                  type: query
              refId: C
              type: classic_conditions

  # ── Fail-open observability (Deep-Eng P0) ────────────────────────────────────
  - orgId: 1
    name: warden_failopen
    folder: Shadow Warden
    interval: 1m
    rules:

      # ── Fail-open spike: a guard errored and requests are being allowed ──────
      - uid: warden-stage-failopen-spike
        title: "Warden — Fail-open spike (guard bypassed)"
        condition: C
        data:
          - refId: A
            queryType: ""
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              expr: >
                sum(increase(warden_stage_failopen_total[5m]))
              intervalMs: 15000
              maxDataPoints: 43200
              instant: true
          - refId: C
            queryType: ""
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: __expr__
            model:
              type: math
              expression: "$A > 0"
        noDataState: OK
        execErrState: Alerting
        for: 0m
        labels:
          severity: critical
          team: warden
        annotations:
          summary: "Warden fail-open events firing — requests may be bypassing a guard"
          description: >
            warden_stage_failopen_total increased in the last 5 minutes: a security
            guard errored and allowed the request through (fail-open). Break down by
            stage/reason in Prometheus. Common causes: Redis down (redis_unavailable),
            model not loaded (model_not_loaded), upstream timeout.

      # ── R3: Pipeline-timeout bypass (whole request skipped security filtering) ──
      # Distinct from the per-stage fail-open above: this fires when the ENTIRE
      # pipeline timed out (PIPELINE_TIMEOUT_MS) and WARDEN_FAIL_STRATEGY=open let
      # the raw, unfiltered request through — every guard was skipped, not just
      # one stage. Only fires at all once PIPELINE_TIMEOUT_MS > 0 (R3); at the
      # default 0 the timeout machinery is disabled and this counter never moves.
      - uid: warden-filter-bypass-spike
        title: "Warden — Pipeline-timeout bypass firing (unfiltered requests passed)"
        condition: C
        data:
          - refId: A
            queryType: ""
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              expr: >
                sum(increase(warden_filter_bypasses_total[5m]))
              intervalMs: 15000
              maxDataPoints: 43200
              instant: true
          - refId: C
            queryType: ""
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: __expr__
            model:
              type: math
              expression: "$A > 0"
        noDataState: OK
        execErrState: Alerting
        for: 0m
        labels:
          severity: critical
          team: warden
        annotations:
          summary: "Warden pipeline-timeout bypass firing — requests skipped ALL security filtering"
          description: >
            warden_filter_bypasses_total increased in the last 5 minutes: the full
            filter pipeline exceeded PIPELINE_TIMEOUT_MS and, under
            WARDEN_FAIL_STRATEGY=open, passed the request through completely
            unfiltered. Check /health for pipeline_timeout_ms and stage latencies —
            likely cause: ML model contention, Redis/DB latency spike, or a hung
            downstream call in one of the 9 pipeline stages.

      # ── Live pipeline canary missing known jailbreaks (detector degraded) ────
      - uid: warden-pipeline-canary-missed
        title: "Warden — Pipeline canary missing jailbreaks"
        condition: C
        data:
          - refId: A
            queryType: ""
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              expr: >
                max(warden_pipeline_canary_missed)
              intervalMs: 15000
              maxDataPoints: 43200
              instant: true
          - refId: C
            queryType: ""
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: __expr__
            model:
              type: math
              expression: "$A > 0"
        noDataState: OK
        execErrState: Alerting
        for: 1m
        labels:
          severity: critical
          team: warden
        annotations:
          summary: "Warden live canary is missing known jailbreaks — detector degraded"
          description: >
            The live-pipeline canary self-test (warden_pipeline_canary_missed > 0) shows
            the detector is letting blatant jailbreaks through. Likely a bad model/corpus
            deploy. Check GET /health/pipeline?deep=true and recent EvolutionEngine changes.

  # ── OB-3: Deadman ───────────────────────────────────────────────────────────
  #
  # Every other group in this file alerts on a metric moving in a bad direction.
  # None of them can tell the difference between "all is well" and "the signal
  # chain is broken and nothing is arriving" — the two look identical from the
  # alerting side, which is exactly how findings OB-F1 through OB-F4 survived in
  # production. These two rules watch the chain itself.
  #
  # execErrState is deliberately Alerting: if Prometheus is unreachable the query
  # errors, and an observability stack that cannot query is the failure this
  # group exists to catch. Do not soften it to OK.
  - orgId: 1
    name: warden_meta
    folder: Shadow Warden
    interval: 1m
    rules:

      # ── The gateway stopped being scraped at all ──────────────────────────────
      - uid: warden-deadman-gateway
        title: "Warden — DEADMAN: gateway metrics have stopped arriving"
        condition: C
        data:
          - refId: A
            queryType: ""
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              expr: >
                absent(up{job="warden"})
              intervalMs: 15000
              maxDataPoints: 43200
              instant: true
          - refId: C
            queryType: ""
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: __expr__
            model:
              type: math
              expression: "$A > 0"
        # absent() returns an empty result while the series exists, so NoData
        # here means "the gateway is being scraped" — the healthy case.
        noDataState: OK
        execErrState: Alerting
        for: 5m
        labels:
          severity: critical
          team: warden
          category: meta
        annotations:
          summary: "No up{job=\"warden\"} series — the gateway is unscraped, not necessarily down"
          description: >
            Prometheus has no up series for job "warden" for 5 minutes. Either the
            gateway is gone, or the scrape job was renamed/removed in
            grafana/prometheus.yml. Both are silent failures for every other rule in
            this file, all of which filter on job="warden". Check the Scrape Target
            Summary table on dashboard sw-unified-v1 and Prometheus /targets.

      # ── Any configured scrape target is down ─────────────────────────────────
      - uid: warden-scrape-target-down
        title: "Warden — Scrape target down"
        condition: C
        data:
          - refId: A
            queryType: ""
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              # node and cadvisor are `profiles: ["monitoring"]` in
              # docker-compose.yml — not started by the default profile, so a
              # bare min(up) reports them down forever and this rule would page
              # continuously on every standard deployment. Only jobs that the
              # default profile actually starts are watched here.
              expr: >
                min by (job) (up{job!~"node|cadvisor"})
              intervalMs: 15000
              maxDataPoints: 43200
              instant: true
          - refId: C
            queryType: ""
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: __expr__
            model:
              type: math
              expression: "$A < 1"
        # No up series at all means Prometheus itself is not collecting.
        noDataState: Alerting
        execErrState: Alerting
        for: 10m
        labels:
          severity: warning
          team: warden
          category: meta
        annotations:
          summary: "A Prometheus scrape target has been down for 10 minutes"
          description: >
            One of the always-on scrape targets is failing. Nothing else in this
            file alerts on the exporters, so without this rule a dead
            postgres-exporter simply makes the Postgres panels go blank.
            node and cadvisor are excluded by design: they only run under the
            `monitoring` compose profile. If you enable that profile, drop the
            job!~ filter so they are covered too.

  # ── OB-4: background worker ─────────────────────────────────────────────────
  #
  # The arq-worker container runs the money crons and the nightly encrypted
  # backup. Before OB-4 it emitted nothing, so every rule in this group is
  # watching something that previously had no signal at all.
  - orgId: 1
    name: warden_worker
    folder: Shadow Warden
    interval: 1m
    rules:

      # ── The worker itself is gone or unscraped ───────────────────────────────
      - uid: warden-arq-worker-down
        title: "Warden — ARQ worker down (backup and settlement crons not running)"
        condition: C
        data:
          - refId: A
            queryType: ""
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              expr: >
                absent(up{job="arq"}) or (up{job="arq"} == 0)
              intervalMs: 15000
              maxDataPoints: 43200
              instant: true
          - refId: C
            queryType: ""
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: __expr__
            model:
              type: math
              expression: "$A > 0"
        noDataState: OK
        execErrState: Alerting
        for: 5m
        labels:
          severity: critical
          team: warden
          category: worker
        annotations:
          summary: "arq-worker is not being scraped or is reporting down"
          description: >
            No healthy up{job="arq"} for 5 minutes. This container runs the nightly
            encrypted backup, monthly overage settlement, nightly ledger and hold
            reconciliation, x402 settlement, the clearing outbox relay and the AML
            sweep. None of them are running while this fires.

      # ── A background job is failing ──────────────────────────────────────────
      - uid: warden-arq-job-failures
        title: "Warden — ARQ background job failing"
        condition: C
        data:
          - refId: A
            queryType: ""
            relativeTimeRange:
              from: 3600
              to: 0
            datasourceUid: prometheus
            model:
              expr: >
                sum(increase(warden_arq_jobs_total{status="failed"}[1h]))
              intervalMs: 15000
              maxDataPoints: 43200
              instant: true
          - refId: C
            queryType: ""
            relativeTimeRange:
              from: 3600
              to: 0
            datasourceUid: __expr__
            model:
              type: math
              expression: "$A > 0"
        noDataState: OK
        execErrState: Alerting
        for: 0m
        labels:
          severity: warning
          team: warden
          category: worker
        annotations:
          summary: "One or more ARQ jobs raised in the last hour"
          description: >
            Break down by job with sum by (task) (increase(warden_arq_jobs_total{status="failed"}[1h])).
            arq retries a failed job, so a single spike may self-heal — a sustained
            rate on a money cron (sova_overage_billing, nightly_ledger_recon,
            nightly_hold_recon, settle_x402_deductions) should not be waited out.

      # ── The nightly backup has not succeeded in over a day ──────────────────
      - uid: warden-backup-stale
        title: "Warden — Nightly encrypted backup has not succeeded in 26h"
        condition: C
        data:
          - refId: A
            queryType: ""
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              expr: >
                time() - max(warden_arq_job_last_success_timestamp{task="sova_nightly_backup"})
              intervalMs: 15000
              maxDataPoints: 43200
              instant: true
          - refId: C
            queryType: ""
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: __expr__
            model:
              type: math
              expression: "$A > 93600"
        # NoData here means the gauge has not been set since the last worker
        # restart, not that the backup failed — prometheus_client gauges start
        # unset and there is no cross-restart persistence. Worker liveness is
        # covered by warden-arq-worker-down above; treating NoData as Alerting
        # would page on every deploy that happens outside the 03:30 window.
        noDataState: OK
        execErrState: Alerting
        for: 10m
        labels:
          severity: critical
          team: warden
          category: worker
        annotations:
          summary: "No successful sova_nightly_backup in over 26 hours"
          description: >
            R1/R6 built encrypted snapshots to two independent S3 targets and proved
            them restorable (RTO ~17s) — but nothing watched whether they are still
            being taken. 26h is the 24h cadence plus a two-hour grace. Check the
            arq-worker logs and that VAULT_MASTER_KEY is set there: the backup is
            fail-CLOSED on the key, so a missing key means no snapshot at all.

  # ── OB-8: money correctness ─────────────────────────────────────────────────
  #
  # FT-2 built ledger reconciliation and FT-4 the settlement jobs; both emit a
  # number every night, and until OB-8 nothing read either one. A drift gauge
  # nobody queries is the same as no reconciliation at all — the clearing engine
  # settled every trade at $0.00 for months while its fixtures agreed with the bug.
  #
  # Severity is `warning`, deliberately. These are correctness and revenue
  # exposures that must be worked the same day, not outages that justify waking
  # someone: the notification policy routes warning to Slack with a 12h repeat.
  - orgId: 1
    name: warden_money
    folder: Shadow Warden
    interval: 5m
    rules:

      # ── Ledger drifted from its authoritative counters ───────────────────────
      - uid: warden-ledger-drift
        title: "Warden — Ledger reconciliation drift is non-zero"
        condition: C
        data:
          - refId: A
            queryType: ""
            relativeTimeRange:
              from: 86400
              to: 0
            datasourceUid: prometheus
            model:
              expr: >
                max(warden_ledger_recon_drift_usd)
              intervalMs: 60000
              maxDataPoints: 43200
              instant: true
          - refId: C
            queryType: ""
            relativeTimeRange:
              from: 86400
              to: 0
            datasourceUid: __expr__
            model:
              type: math
              expression: "$A > 0"
        # Absent means the nightly recon has not run since the last restart, which
        # is covered by warden-arq-worker-down and the backup-freshness rule — not
        # by paging on a gauge that was never set.
        noDataState: OK
        execErrState: OK
        for: 10m
        labels:
          severity: warning
          team: warden
          category: money
        annotations:
          summary: "nightly_ledger_recon reported a non-zero USD gap"
          description: >
            warden_ledger_recon_drift_usd is above zero: the ledger and its
            authoritative counters disagree. This is not a rounding artefact — the
            job reports an absolute USD figure. Inspect the last run of
            nightly_ledger_recon in arq-worker, then the clearing outbox relay.
            Dashboard: http://127.0.0.1:3001/d/sw-l1-payments

      # ── Open holds drifted from their contra accounts ────────────────────────
      - uid: warden-ledger-hold-drift
        title: "Warden — Open-hold drift is non-zero"
        condition: C
        data:
          - refId: A
            queryType: ""
            relativeTimeRange:
              from: 86400
              to: 0
            datasourceUid: prometheus
            model:
              expr: >
                max(warden_ledger_recon_hold_drift_usd)
              intervalMs: 60000
              maxDataPoints: 43200
              instant: true
          - refId: C
            queryType: ""
            relativeTimeRange:
              from: 86400
              to: 0
            datasourceUid: __expr__
            model:
              type: math
              expression: "$A > 0"
        noDataState: OK
        execErrState: OK
        for: 10m
        labels:
          severity: warning
          team: warden
          category: money
        annotations:
          summary: "nightly_hold_recon reported a non-zero USD gap"
          description: >
            Currently-open holds do not match their ledger contra accounts. A hold
            that was released without its contra entry leaves money reserved against
            nothing. Check nightly_hold_recon and the x402 settlement job.
            Dashboard: http://127.0.0.1:3001/d/sw-l1-payments

      # ── Overage settlement failed ────────────────────────────────────────────
      - uid: warden-overage-settlement-failed
        title: "Warden — Overage settlement job failed"
        condition: C
        data:
          - refId: A
            queryType: ""
            relativeTimeRange:
              from: 86400
              to: 0
            datasourceUid: prometheus
            model:
              expr: >
                sum(increase(warden_arq_jobs_total{task="sova_overage_billing", status="failed"}[24h]))
              intervalMs: 60000
              maxDataPoints: 43200
              instant: true
          - refId: C
            queryType: ""
            relativeTimeRange:
              from: 86400
              to: 0
            datasourceUid: __expr__
            model:
              type: math
              expression: "$A > 0"
        noDataState: OK
        execErrState: OK
        for: 0m
        labels:
          severity: warning
          team: warden
          category: money
        annotations:
          summary: "sova_overage_billing raised in the last 24h — revenue may be uncollected"
          description: >
            The monthly overage cron failed. settle() is idempotent per
            (tenant_id, period), so a re-run cannot double-charge — retrying is safe.
            A charge that could not be presented stores as `failed`, never silently as
            `charged`. Note OVERAGE_CHARGE_ENFORCED gates whether money actually moves;
            with it off, a failure here still means the audit trail is incomplete.
            Dashboard: http://127.0.0.1:3001/d/sw-l1-finops
