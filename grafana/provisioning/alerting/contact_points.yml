apiVersion: 1

# ── Shadow Warden AI — Alert delivery (OB-3) ─────────────────────────────────
#
# This file used to ship `contactPoints: []` and `policies: []`, with a comment
# deferring both to the Grafana UI "to avoid provisioning crashes when env vars
# are not set". The cost of that was severe and silent: every routing decision
# lived only inside the `grafana-data` Docker volume, which is in no backup set
# (warden/backup/service.py discovers `warden_*.db` plus a Postgres dump — not
# Grafana's own SQLite). A volume loss removed alert delivery with no signal,
# and 22 rules evaluated into nothing.
#
# The crash worry is handled the right way instead: docker-compose.yml gives
# both variables a syntactically valid placeholder default, so provisioning
# always validates. An unconfigured deployment therefore fails *loudly* — the
# delivery error is visible in Grafana's notification log — rather than
# silently having nowhere to send. Visible misconfiguration beats invisible
# non-delivery; that is the whole lesson of OB-F3.
#
# Severity vocabulary matches the labels the rules already carry:
#   critical → ntfy + Slack        (wake someone)
#   warning  → Slack               (file it)
# ─────────────────────────────────────────────────────────────────────────────

contactPoints:

  - orgId: 1
    name: warden-slack
    receivers:
      - uid: warden-slack-webhook
        type: slack
        disableResolveMessage: false
        # The webhook URL is a bearer credential and `settings` is not encrypted
        # at rest, so moving it to `secure_settings` looks correct — and breaks
        # Grafana 12.4.1 hard. Its slack validator reads `url` from `settings`;
        # with it absent the integration is taken to be the Slack chat API,
        # which then demands `recipient`, provisioning fails to map the file and
        # the container exits(1). Verified: not a warning, a crash loop. Keep
        # `url` here and protect it by keeping the value in the host .env.
        settings:
          url: ${GF_SLACK_WEBHOOK_URL}
          title: '{{ template "default.title" . }}'
          text: '{{ template "default.message" . }}'

  # ── ntfy — the free wake-up channel (OB-3b) ──────────────────────────────────
  #
  # Slack and PagerDuty are not interchangeable, and the difference is exactly
  # one thing: a Slack message at 03:00 does not wake anyone. That single
  # property — a push that overrides silent mode — is the whole reason to pay
  # $25/user/month, and ntfy delivers it for nothing. Priority 5 ("urgent") on
  # the ntfy app rings through Do Not Disturb on both Android and iOS.
  #
  # This does NOT replace PagerDuty. It has no escalation policy, no on-call
  # rotation, no ack/resolve lifecycle and therefore no MTTA/MTTR evidence —
  # all of which become contractual the moment an Enterprise SLA is signed
  # (docs/sla.md §5 already names PagerDuty as the Enterprise notification
  # channel, and §6 as the on-call contact for SOC 2 A1 evidence). Until then
  # the paid product buys governance we cannot yet use, while the free one
  # buys the alarm clock we can.
  #
  # THE TOPIC NAME IS THE CREDENTIAL. On public ntfy.sh anyone who knows the
  # topic can both read every alert and publish forged ones, so the whole URL
  # lives in the host .env and never in this repo. Generate an unguessable one:
  #     python -c "import secrets; print('https://ntfy.sh/warden-' + secrets.token_urlsafe(16))"
  # then subscribe to that topic in the ntfy mobile app.
  #
  # Grafana posts its standard alert JSON as the request body; ntfy publishes a
  # request body verbatim as the message text, so no custom payload template is
  # needed. Title/priority/tags ride in the query string of the configured URL
  # (docs.ntfy.sh/publish — query parameters are supported on any publish
  # request, for exactly the case where request headers cannot be set). That
  # keeps this contact point on the smallest possible schema surface: `url` and
  # `httpMethod`, nothing else. This file has already crash-looped production
  # twice by reaching for a richer schema than the running Grafana accepted
  # (uid pinning, then secure_settings) — the cheap shape is the safe one.
  - orgId: 1
    name: warden-ntfy
    receivers:
      - uid: warden-ntfy-push
        type: webhook
        disableResolveMessage: false
        settings:
          url: ${GF_NTFY_URL}
          httpMethod: POST

  # ── warden-pagerduty: removed 2026-08-22 ────────────────────────────────────
  #
  # PagerDuty was never configured — `PAGERDUTY_ROUTING_KEY` is empty on
  # production — so every critical notification produced a `400 Invalid routing
  # key` in the notification log: 576 of them in one 24h window. OB-3 chose that
  # loud failure deliberately over silent non-delivery, and it did its job: the
  # question got asked and answered. The answer was ntfy, which delivers the same
  # wake-up for nothing, so the receiver had no remaining purpose — an alerting
  # path that can only fail is worse than one that does not exist, because it
  # trains the operator to read delivery errors as normal.
  #
  # Restoring it is a receiver block plus a route: both are in this file's git
  # history, and `docs/sla.md` §5 still names PagerDuty as the Enterprise channel,
  # so an Enterprise SLA is when this comes back — with a key, not before.

policies:

  - orgId: 1
    receiver: warden-slack
    group_by: [alertname, category]
    group_wait: 30s
    group_interval: 5m
    repeat_interval: 4h
    routes:

      # critical → phone push, and still land in Slack for the written record.
      # `continue: true` is what makes the notification reach both receivers;
      # without it matching stops at the first route and ntfy would be the only
      # destination.
      - receiver: warden-ntfy
        object_matchers:
          - [severity, "=", critical]
        group_wait: 10s
        repeat_interval: 1h
        continue: true

      - receiver: warden-slack
        object_matchers:
          - [severity, "=", critical]

      - receiver: warden-slack
        object_matchers:
          - [severity, "=", warning]
        group_wait: 1m
        repeat_interval: 12h
