server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:

  # ── All Docker container logs ─────────────────────────────────────────────
  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
        filters:
          - name: label
            values: ["com.docker.compose.project=shadow-warden"]
    relabel_configs:
      - source_labels: [__meta_docker_container_name]
        target_label: container
      - source_labels: [__meta_docker_compose_service]
        target_label: service
      - source_labels: [__meta_docker_container_log_stream]
        target_label: stream

    pipeline_stages:
      # Parse JSON log lines from warden (structured logging)
      # ── warden gateway — structured JSON ──────────────────────────────────
      # These expressions must match what warden/main.py::_JsonFormatter
      # actually emits. Until OB-9 they did not: the formatter wrote only
      # ts/level/logger/message, so `request_id` and `risk_level` were parsed
      # out of every line and always came back empty — the Loki `risk_level`
      # label an operator would filter on had never held a value (OB-F11).
      #
      # trace_id is extracted but deliberately NOT promoted to a label: it is
      # high-cardinality and would blow up Loki's index. It stays in the line,
      # where the Loki datasource's derivedFields turns it into a link to
      # Jaeger (see provisioning/datasources/prometheus.yml). Labels are for
      # bounded values only — level, logger, risk_level.
      - match:
          selector: '{service="warden"}'
          stages:
            - json:
                expressions:
                  level:      level
                  logger:     logger
                  request_id: request_id
                  risk_level: risk_level
                  trace_id:   trace_id
            - labels:
                level:
                logger:
                risk_level:
            - drop:
                expression: ".*health.*"   # drop /health poll noise
      # Structured logs from analytics
      - match:
          selector: '{service="analytics"}'
          stages:
            - json:
                expressions:
                  level: level
            - labels:
                level:
