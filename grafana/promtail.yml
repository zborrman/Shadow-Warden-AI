server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:

  # ── All Docker container logs ─────────────────────────────────────────────
  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
        filters:
          # ── OB-F13 ────────────────────────────────────────────────────────
          # This filter is a NAME, and the name is derived from the directory
          # compose was started in. It read `shadow-warden` unconditionally,
          # which is right on the VPS (/opt/shadow-warden) and wrong on any
          # checkout whose folder is named anything else. When it is wrong,
          # promtail discovers zero containers and sends zero lines: Loki holds
          # no labels at all, and every log panel renders empty rather than
          # erroring — indistinguishable from "nothing was logged".
          #
          # Requires `-config.expand-env=true` on the promtail command line and
          # COMPOSE_PROJECT_NAME in the container env. The default keeps
          # production behaviour byte-identical.
          - name: label
            values: ["com.docker.compose.project=${COMPOSE_PROJECT_NAME:-shadow-warden}"]
    relabel_configs:
      - source_labels: [__meta_docker_container_name]
        target_label: container
      # ── OB-F14 ──────────────────────────────────────────────────────────
      # `__meta_docker_compose_service` is not a meta label promtail's docker
      # SD produces. Compose labels arrive as
      # `__meta_docker_container_label_<label>`, so the old source name matched
      # nothing and `service` was written empty for every container.
      #
      # Consequence chain: with no `service` label, the two `match:` stages
      # below select on `{service="warden"}` / `{service="analytics"}` and can
      # never fire — so the json stages never run and `level`, `logger` and
      # `risk_level` were never attached to any line. OB-F11 fixed the
      # formatter so those fields are emitted; this is the second half, the
      # reason the labels still would not have appeared.
      - source_labels: [__meta_docker_container_label_com_docker_compose_service]
        target_label: service
      - source_labels: [__meta_docker_container_log_stream]
        target_label: stream

    pipeline_stages:
      # Parse JSON log lines from warden (structured logging)
      # ── warden gateway — structured JSON ──────────────────────────────────
      # These expressions must match what warden/main.py::_JsonFormatter
      # actually emits. Until OB-9 they did not: the formatter wrote only
      # ts/level/logger/message, so `request_id` and `risk_level` were parsed
      # out of every line and always came back empty — the Loki `risk_level`
      # label an operator would filter on had never held a value (OB-F11).
      #
      # trace_id is deliberately absent here. It must not become a label (high
      # cardinality would blow up Loki's index), and a json-stage extraction
      # would be inert anyway: that stage writes to the extracted map, not to
      # the stored line, and nothing downstream reads it. The Loki datasource's
      # derivedFields matches trace_id against the raw line instead — see
      # provisioning/datasources/prometheus.yml. Labels stay bounded: level,
      # logger, risk_level.
      - match:
          selector: '{service="warden"}'
          stages:
            - json:
                expressions:
                  level:      level
                  logger:     logger
                  request_id: request_id
                  risk_level: risk_level
            - labels:
                level:
                logger:
                risk_level:
            - drop:
                expression: ".*health.*"   # drop /health poll noise
      # Structured logs from analytics
      - match:
          selector: '{service="analytics"}'
          stages:
            - json:
                expressions:
                  level: level
            - labels:
                level:
